<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Gasto por INEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   CONTROLE DE GASTO POR INEP — folha de estilo unica
   Direcao visual: "planta baixa" — azul-tinta, papel claro, numeros
   monoespacados. O elemento assinatura e a barra de capacidade do INEP.
   =================================================================== */
:root{
  --tinta:#101C2E; --tinta-2:#1B2C44; --tinta-3:#2A3E5A;
  --papel:#F2F4F7; --branco:#FFFFFF; --linha:#DCE3EC; --linha-2:#EDF1F6;
  --texto:#16202E; --texto-2:#5A6B80; --texto-3:#8896A8;
  --sinal:#0B5FCB; --sinal-claro:#E7F0FE;
  --ok:#0E7A61; --ok-claro:#E3F4EF;
  --alerta:#A9670B; --alerta-claro:#FDF3E2;
  --perigo:#B42318; --perigo-claro:#FDECEA;
  --r:10px; --sombra:0 1px 2px rgba(16,28,46,.06), 0 8px 24px rgba(16,28,46,.06);
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  background:var(--papel); color:var(--texto); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Archivo",sans-serif; margin:0; letter-spacing:-.01em; font-weight:600}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px}
.mono,.num,td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
a{color:var(--sinal)}
button{font-family:inherit}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-arte{
  background:var(--tinta); color:#fff; padding:56px 48px; display:flex;
  flex-direction:column; justify-content:space-between;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:28px 28px;
}
.login-arte h1{font-size:38px;line-height:1.1;max-width:9em;color:#fff}
.login-arte p{color:#9FB2CB;max-width:32ch}
.login-selo{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;color:#6E86A5;text-transform:uppercase}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-card{width:100%;max-width:360px}
@media(max-width:860px){ .login-wrap{grid-template-columns:1fr} .login-arte{display:none} }

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--tinta);color:#C7D4E5;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.rail .marca{font-family:"Archivo",sans-serif;font-weight:700;color:#fff;font-size:15px;padding:0 10px 4px;letter-spacing:-.01em}
.rail .marca span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;color:#6E86A5;font-weight:400;margin-top:3px}
.rail hr{border:0;border-top:1px solid rgba(255,255,255,.09);margin:14px 0 10px;width:100%}
.rail button{
  display:block;width:100%;text-align:left;background:transparent;border:0;color:#C7D4E5;
  padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;
}
.rail button:hover{background:rgba(255,255,255,.07);color:#fff}
.rail button.ativo{background:var(--sinal);color:#fff;font-weight:600}
.rail .rodape{margin-top:auto;font-size:11px;color:#6E86A5;padding:0 10px}
.rail .quem{padding:10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:6px}
.rail .quem b{color:#fff;display:block;font-size:13px}
.rail .quem em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8FA6C2}
.conteudo{padding:26px 30px 60px;max-width:1500px}
.cabeca{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cabeca p{margin:4px 0 0;color:var(--texto-2)}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .rail .marca,.rail hr,.rail .rodape,.rail .quem{display:none}
  .conteudo{padding:18px 16px 50px}
}

/* ---------- componentes ---------- */
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.cartao-pad{padding:18px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:620px){.g4,.g2{grid-template-columns:1fr}}

.indicador{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.indicador .rotulo{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3)}
.indicador .valor{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.indicador .nota{font-size:12px;color:var(--texto-2);margin-top:2px}
.indicador.perigo .valor{color:var(--perigo)}
.indicador.ok .valor{color:var(--ok)}

label{display:block;font-size:12.5px;font-weight:500;color:var(--texto-2);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:8px;background:var(--branco);
  font-family:inherit;font-size:14px;color:var(--texto);
}
input.num,input[type=number]{font-family:"IBM Plex Mono",monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sinal);outline-offset:-1px;border-color:var(--sinal)}
textarea{min-height:80px;resize:vertical}
.campo{margin-bottom:14px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;
  padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--sinal);color:#fff;
}
.btn:hover{filter:brightness(.94)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.neutro{background:var(--branco);color:var(--texto);border-color:var(--linha)}
.btn.ok{background:var(--ok)} .btn.alerta{background:var(--alerta)} .btn.perigo{background:var(--perigo)}
.btn.fantasma{background:transparent;color:var(--sinal)}
.btn.pequeno{padding:6px 11px;font-size:12.5px}
.barra-acoes{display:flex;gap:9px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--linha);
  white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
tbody tr:hover{background:var(--linha-2)}
td.num,th.num{text-align:right}
.tabela-rolagem{overflow-x:auto;border-radius:var(--r)}

.selo{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;
}
.selo.azul{background:var(--sinal-claro);color:var(--sinal)}
.selo.verde{background:var(--ok-claro);color:var(--ok)}
.selo.ambar{background:var(--alerta-claro);color:var(--alerta)}
.selo.vermelho{background:var(--perigo-claro);color:var(--perigo)}
.selo.cinza{background:var(--linha-2);color:var(--texto-2)}

/* ---------- ASSINATURA: barra de capacidade do INEP ---------- */
.capacidade{margin-top:6px}
.capacidade .trilho{
  height:9px;border-radius:999px;background:var(--linha);overflow:hidden;display:flex;
  box-shadow:inset 0 0 0 1px rgba(16,28,46,.05);
}
.capacidade .parte{height:100%}
.capacidade .instalacao{background:var(--tinta-3)}
.capacidade .compras{background:var(--sinal)}
.capacidade .estouro{
  background:repeating-linear-gradient(45deg,var(--perigo),var(--perigo) 4px,#e0574c 4px,#e0574c 8px);
}
.capacidade .legenda{
  display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--texto-2);margin-top:5px;gap:10px;
}
.capacidade .legenda b{color:var(--texto)}

.aviso{border-radius:var(--r);padding:13px 15px;font-size:13.5px;border:1px solid}
.aviso.info{background:var(--sinal-claro);border-color:#C6DDFB;color:#0A4894}
.aviso.alerta{background:var(--alerta-claro);border-color:#F2DFBC;color:#7A4A08}
.aviso.perigo{background:var(--perigo-claro);border-color:#F6CFCB;color:#8C1B12}
.aviso.ok{background:var(--ok-claro);border-color:#BFE5DA;color:#0A5C49}
.aviso h4{margin-bottom:5px}
.aviso ul{margin:6px 0 0 18px;padding:0}

.vazio{text-align:center;padding:44px 20px;color:var(--texto-2)}
.vazio h3{margin-bottom:6px;color:var(--texto)}

/* ---------- modal ---------- */
.cortina{position:fixed;inset:0;background:rgba(16,28,46,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:var(--branco);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(16,28,46,.3)}
.modal-cabeca{padding:18px 20px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--branco)}
.modal-corpo{padding:20px}
.modal-pe{padding:14px 20px;border-top:1px solid var(--linha);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--branco)}
.fechar{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--texto-3)}

/* ---------- aviso flutuante ---------- */
#torradeira{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.torrada{background:var(--tinta);color:#fff;padding:11px 15px;border-radius:9px;font-size:13.5px;max-width:420px;box-shadow:0 10px 30px rgba(16,28,46,.3);user-select:text}
.torrada.ok{background:var(--ok)}
.torrada.erro{background:var(--perigo);cursor:pointer;padding-right:34px;position:relative}
.torrada.erro::after{content:"×";position:absolute;right:12px;top:9px;font-size:17px;opacity:.8}
.torrada.erro small{display:block;opacity:.85;font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:5px}

.pedido-grade{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1080px){.pedido-grade{grid-template-columns:1fr}}
.item{border:1px solid var(--linha);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--branco)}
.item-cabeca{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.item-cabeca .indice{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3)}
.item textarea.descricao{min-height:56px;line-height:1.45}
.item-numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}
.item-numeros label{font-size:11px;margin-bottom:3px}
@media(max-width:600px){.item-numeros{grid-template-columns:repeat(2,minmax(0,1fr))}}
.escolha{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--linha);border-radius:8px;margin-bottom:7px;background:var(--branco)}
.escolha input[type=checkbox]{width:16px;height:16px;margin:0;flex:none}
.escolha .info{flex:1;min-width:0}
.escolha .info b{display:block;font-size:13.5px}
.escolha .info small{color:var(--texto-2)}
.escolha.bloqueada{opacity:.55;background:var(--linha-2)}
.lista-rolagem{max-height:330px;overflow:auto;padding-right:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
*:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ .capacidade .parte{transition:width .25s ease} }
</style>

const estado = { token:"", usuario:null, tela:"painel", dados:{}, rascunho:null };

const memoria = {};
function guardar(chave, valor){ try{ localStorage.setItem(chave, valor); }catch(e){ memoria[chave]=valor; } }
function ler(chave){ try{ return localStorage.getItem(chave) || memoria[chave] || ""; }catch(e){ return memoria[chave] || ""; } }
function apagar(chave){ try{ localStorage.removeItem(chave); }catch(e){} delete memoria[chave]; }

function dinheiro(v){
  return (Number(v)||0).toLocaleString(idioma==="en"?"en-US":"pt-BR",{style:"currency",currency:"BRL"});
}
function numero(v,casas){ return (Number(v)||0).toLocaleString(idioma==="en"?"en-US":"pt-BR",{minimumFractionDigits:casas||0,maximumFractionDigits:casas||0}); }
function dataHora(v){ if(!v) return "-"; return new Date(v).toLocaleString(idioma==="en"?"en-US":"pt-BR"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function id(x){ return document.getElementById(x); }
function val(x){ const e=id(x); return e ? e.value.trim() : ""; }
function numVal(x){ const e=id(x); return e ? Number(String(e.value).replace(",", ".")) || 0 : 0; }

/* Mascara de moeda: o campo e texto, o usuario digita so numeros e a
   ultima dupla de digitos vira centavos. deMoeda() devolve o numero puro. */
function deMoeda(texto){
  const digitos = String(texto ?? "").replace(/\D/g, "");
  return digitos ? Number(digitos)/100 : 0;
}
function formatarMoeda(campo){
  const digitos = String(campo.value).replace(/\D/g, "");
  const valor = digitos ? Number(digitos)/100 : 0;
  campo.value = digitos ? dinheiro(valor) : "";
  return valor;
}
function moedaVal(x){ const e = id(x); return e ? deMoeda(e.value) : 0; }

/* Aviso de erro NAO some sozinho: fica ate o clique, para dar tempo de ler
   e copiar a mensagem. Aviso de sucesso continua sumindo em 5 segundos. */
function torrada(texto, tipo, codigo){
  const d=document.createElement("div");
  d.className="torrada "+(tipo||"");
  d.textContent=texto;
  if (tipo==="erro" && codigo){
    const s=document.createElement("small");
    s.textContent="codigo "+codigo;
    d.appendChild(s);
  }
  id("torradeira").appendChild(d);
  if (tipo==="erro"){
    console.error("[gasto-inep]", texto, codigo||"");
    d.onclick=()=>d.remove();
  } else {
    setTimeout(()=>d.remove(), 5200);
  }
}

/* ===================================================================
   4. UNICA FUNCAO QUE CONVERSA COM O BACKEND
   =================================================================== */
async function api(acao, dados){
  const cabecalhos = { "Content-Type":"application/json" };
  if (SUPABASE_ANON_KEY){
    cabecalhos["apikey"] = SUPABASE_ANON_KEY;
    cabecalhos["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
  }
  let resposta;
  try{
    resposta = await fetch(API_URL, {
      method:"POST", headers:cabecalhos,
      body: JSON.stringify({ acao, token: estado.token, dados: dados||{} })
    });
  }catch(e){
    throw new Error("Nao consegui falar com o servidor. Confira a URL da API e a conexao.");
  }
  let corpo = {};
  try{ corpo = await resposta.json(); }catch(e){ throw new Error("Resposta invalida do servidor."); }
  if (!corpo.ok){
    if (resposta.status === 401){ encerrarLocal(); desenhar(); }
    const falha = new Error(corpo.erro || "Erro inesperado.");
    falha.codigo = corpo.codigo || "";
    throw falha;
  }
  return corpo.dados;
}

/* ===================================================================

   =================================================================== */
function barraCapacidade(e){
  const limite = Number(e.limite)||0;
  const inst = Number(e.gastoInstalacao)||0;
  const compras = Number(e.gastoPedidos)||0;
  const total = inst + compras;
  const base = Math.max(limite, total, 1);
  const pInst = Math.min(100, inst/base*100);
  const pCompras = Math.min(100-pInst, compras/base*100);
  const estouro = Math.max(0, total-limite);
  const pEstouro = limite>0 ? Math.min(100, estouro/base*100) : 0;
  const classe = limite<=0 ? "" : (total>limite ? "perigo" : (total/limite>0.85 ? "alerta" : "ok"));
  return `
   <div class="capacidade">
     <div class="trilho">
       <div class="parte instalacao" style="width:${pInst}%"></div>
       <div class="parte compras" style="width:${pCompras - pEstouro > 0 ? pCompras - pEstouro : 0}%"></div>
       ${pEstouro>0 ? `<div class="parte estouro" style="width:${pEstouro}%"></div>` : ""}
     </div>
     <div class="legenda">
       <span><b>${dinheiro(total)}</b> / ${limite>0 ? dinheiro(limite) : t("semLimite")}</span>
       <span class="${classe==="perigo"?"":""}" style="color:${classe==="perigo"?"var(--perigo)":classe==="alerta"?"var(--alerta)":"var(--texto-2)"}">
         ${limite>0 ? numero(e.percentualUso,1)+"%" : "—"}
       </span>
     </div>
   </div>`;
}

const STATUS_ESCOLA = ["Em andamento","Suspenso","Cancelado","Finalizado"];

/* A tabela de kits vem do banco (o admin edita na tela de Kits).
   Se ainda nao foi carregada, cai no calculo classico: 1.740 + 610 por AP. */
const VALOR_KIT_1 = 1740, VALOR_AP_ADICIONAL = 610;

async function carregarKits(recarregar){
  if (!estado.kits || recarregar){
    try{ estado.kits = await api("kits.listar", {}); }
    catch(e){ estado.kits = { kits:[], apAdicional:VALOR_AP_ADICIONAL }; }
  }
  return estado.kits;
}

function receitaPorAps(aps){
  const n = Math.trunc(Number(aps) || 0);
  if (n <= 0) return 0;
  const tabela = estado.kits;
  const adicional = tabela ? Number(tabela.apAdicional)||0 : VALOR_AP_ADICIONAL;
  const linhas = tabela ? [...tabela.kits].sort((x,y)=>x.aps-y.aps) : [];
  if (linhas.length === 0) return Math.round((VALOR_KIT_1 + adicional*(n-1))*100)/100;

  const exato = linhas.find(k=>Number(k.aps)===n);
  if (exato) return Math.round(Math.max(0, Number(exato.valor))*100)/100;

  const menores = linhas.filter(k=>Number(k.aps)<n);
  if (menores.length === 0){
    const primeiro = linhas[0];
    return Math.round(Math.max(0, Number(primeiro.valor) - adicional*(Number(primeiro.aps)-n))*100)/100;
  }
  const base = menores[menores.length-1];
  return Math.round(Math.max(0, Number(base.valor) + adicional*(n-Number(base.aps)))*100)/100;
}

/* ===================================================================
   11c. TELA — TABELA DE KITS (admin)
   Estes valores sao a receita do contrato: mexer aqui muda tudo.
   =================================================================== */
async function telaKits(alvo){
  carregando(alvo);
  const tabela = await carregarKits(true);
  const linhas = [...tabela.kits].sort((a,b)=>a.aps-b.aps)
    .map(k=>({ aps:Number(k.aps), valor:Number(k.valor) }));
  let adicional = Number(tabela.apAdicional)||0;

  alvo.innerHTML = `
    <div class="cabeca">
      <div><h1>${t("tabelaKits")}</h1><p>${t("kitsAviso")}</p></div>
      <div class="barra-acoes">
        <button class="btn" id="btSalvarKits">${t("salvar")}</button>
      </div>
    </div>

    <div class="grade g2" style="align-items:start">
      <div class="cartao">
        <div class="tabela-rolagem"><table>
          <thead><tr><th>${t("kit")}</th><th class="num">${t("aps")}</th>
            <th class="num">${t("valor")}</th><th style="width:44px"></th></tr></thead>
          <tbody id="kitsCorpo"></tbody>
        </table></div>
        <div class="cartao-pad" style="border-top:1px solid var(--linha)">
          <button class="btn neutro pequeno" id="btAddKit">+ ${t("adicionarKit")}</button>
        </div>
      </div>

      <div class="cartao cartao-pad">
        <div class="campo"><label for="kAdicional">${t("apAdicional")}</label>
          <input id="kAdicional" class="num" inputmode="numeric" value="${dinheiro(adicional)}">
          <small style="color:var(--texto-3)">${t("apAdicionalNota")}</small></div>
        <div class="aviso info">${t("kitsAviso")}</div>
      </div>
    </div>`;

  function montar(){
    const corpo = id("kitsCorpo");
    corpo.innerHTML = linhas.map((k,i)=>`
      <tr>
        <td class="mono">KIT ${i+1}</td>
        <td class="num"><input type="number" min="1" class="num" style="width:78px;text-align:right"
          value="${k.aps}" data-aps="${i}"></td>
        <td class="num"><input class="num" inputmode="numeric" style="width:130px;text-align:right"
          value="${dinheiro(k.valor)}" data-valor="${i}"></td>
        <td><button class="btn neutro pequeno" data-remover="${i}">×</button></td>
      </tr>`).join("");

    corpo.querySelectorAll("[data-aps]").forEach(inp=> inp.addEventListener("input", ()=>{
      linhas[Number(inp.dataset.aps)].aps = Math.max(1, Math.trunc(Number(inp.value)||1));
    }));
    corpo.querySelectorAll("[data-valor]").forEach(inp=> inp.addEventListener("input", ()=>{
      linhas[Number(inp.dataset.valor)].valor = formatarMoeda(inp);
    }));
    corpo.querySelectorAll("[data-remover]").forEach(bt=> bt.onclick = ()=>{
      linhas.splice(Number(bt.dataset.remover), 1); montar();
    });
  }

  id("btAddKit").onclick = ()=>{
    const proximo = linhas.length ? Math.max(...linhas.map(k=>k.aps))+1 : 1;
    linhas.push({ aps:proximo, valor:0 });
    montar();
  };
  id("kAdicional").addEventListener("input", ()=>{ adicional = formatarMoeda(id("kAdicional")); });
  id("btSalvarKits").onclick = async ()=>{
    try{
      await api("kits.salvar", { kits: linhas, apAdicional: adicional });
      await carregarKits(true);
      torrada(t("salvo"), "ok");
      desenhar();
    }catch(e){ torrada(e.message, "erro", e.codigo); }
  };

  montar();
}

    if (!ehAdmin) return;
    const aps = numVal("cApsInst");
    const receita = receitaPorAps(aps);
    const limite = receita * numVal("cPercentual")/100;
    const racks = numVal("cRacks");
    const escolhido = parceiros.find(x=>x.id===val("cParceiro"));
    const doParceiro = (escolhido && escolhido.custos ? escolhido.custos : []).reduce((soma,c)=>{

      return soma + (Number(c.valor)||0)*q;

      ? `${regra} ${t("parceiroSemCustos")}`
      : `${regra} ${linhas.length} ${t("custosParceiro").toLowerCase()}.`;
    previa();
  }
  id("cParceiro").addEventListener("change", seguirParceiro);
  seguirParceiro();

  if (ehAdmin){
    ["cApsInst","cPercentual","cRacks"].forEach(c=> id(c).addEventListener("input", previa));
  }
  previa();

  const voltar = estado.dados.voltarPara || "escolas";
  id("btVoltar").onclick = id("btCancelar").onclick = ()=>irPara(voltar);
  id("btSalvar").onclick = async ()=>{
    try{
      await api("escolas.salvar", {
        id: e.id || "", inep: val("cInep"), escola: val("cEscola"), cidade: val("cCidade"),
        uf: val("cUf"), projeto: val("cProjeto"), status: val("cStatus"), prioridade: val("cPrioridade"),
        qtdApsPrev: numVal("cApsPrev"), qtdApsInst: numVal("cApsInst"), parceiroId: val("cParceiro"),
        qtdRacks: numVal("cRacks"),
        percentualLimite: ehAdmin ? numVal("cPercentual") : 0,
      });
      torrada(t("salvo"),"ok"); irPara(voltar);
    }catch(err){ torrada(err.message,"erro",err.codigo); }
  };
}

/* ===================================================================
   11a. TELA — SIMULACAO DE LUCRO (admin)
   Imposto incide sobre o total a receber.
   O parceiro socio recebe sobre (recebido - gastos - impostos).
   =================================================================== */
async function telaSimulacao(alvo){
  carregando(alvo);
  let escolas = [];
  await carregarKits();
  try{
    escolas = (await api("escolas.listar", {})).escolas.filter(e=>e.ativo);
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; return; }

  if (!estado.simulacao) estado.simulacao = { imposto:0, socio:0, selecionadas:null, aps:{} };
  const sim = estado.simulacao;
  const todos = escolas.map(e=>e.id);
  sim.selecionadas = sim.selecionadas === null ? todos.slice() : sim.selecionadas.filter(x=>todos.includes(x));

  const apsDe = (e)=> sim.aps[e.id] !== undefined ? sim.aps[e.id] : (Number(e.qtdApsInst)||0);

  function contas(){
    let receita = 0, gastos = 0;
    const linhas = escolas.map(e=>{
      const aps = apsDe(e);
      const r = receitaPorAps(aps);
      const racks = Number(e.qtdRacks)||0;
      const doParceiro = (e.detalheParceiro||[]).reduce((soma,c)=>{
        const q = c.tipo==="ap" ? aps : c.tipo==="rack" ? racks : 1;
        return soma + (Number(c.valor)||0)*q;
      }, 0);
      const g = doParceiro + (Number(e.gastoPedidos)||0);
      const dentro = sim.selecionadas.includes(e.id);
      if (dentro){ receita += r; gastos += g; }
      return { e, aps, receita:r, gastos:g, dentro };
    });
    const imposto = receita * (Number(sim.imposto)||0) / 100;
    const baseSocio = receita - gastos - imposto;
    const socio = Math.max(0, baseSocio) * (Number(sim.socio)||0) / 100;
    const custoTotal = gastos + imposto + socio;
    const lucro = receita - custoTotal;
    return { linhas, receita, gastos, imposto, baseSocio, socio, custoTotal, lucro,
      margem: custoTotal > 0 ? receita/custoTotal : 0,
      margemLiquida: receita > 0 ? lucro/receita*100 : 0 };
  }

  alvo.innerHTML = `
    <div class="cabeca">
      <div><h1>${t("simulacao")}</h1><p>${t("notaSimulacao")}</p></div>
    </div>

    <div class="cartao cartao-pad" style="margin-bottom:16px">
      <div class="grade g4">
        <div class="campo" style="margin:0"><label for="sImposto">${t("imposto")}</label>
          <input id="sImposto" type="number" step="0.01" min="0" max="100" class="num" value="${sim.imposto}"></div>
        <div class="campo" style="margin:0"><label for="sSocio">${t("socio")}</label>
          <input id="sSocio" type="number" step="0.01" min="0" max="100" class="num" value="${sim.socio}"></div>
        <div class="campo" style="margin:0"><label>&nbsp;</label>
          <div class="barra-acoes">
            <button class="btn neutro pequeno" id="btTodas">${t("selecionarTodas")}</button>
            <button class="btn neutro pequeno" id="btNenhuma">${t("limparSelecao")}</button>
          </div></div>
        <div class="campo" style="margin:0"><label>&nbsp;</label>
          <div class="mono" id="simContagem" style="padding-top:9px;color:var(--texto-2)"></div></div>
      </div>
    </div>

    <div class="grade g4" id="simTotais" style="margin-bottom:16px"></div>

    <div class="cartao tabela-rolagem">
      <table>
        <thead><tr>
          <th style="width:34px"></th><th>${t("inep")}</th><th>${t("escola")}</th>
          <th class="num">${t("apsSimulados")}</th><th class="num">${t("receita")}</th>
          <th class="num">${t("totalGastos")}</th><th class="num">${t("lucro")}</th>
        </tr></thead>
        <tbody id="simCorpo"></tbody>
      </table>
    </div>`;

  function pintarTotais(){
    const c = contas();
    id("simContagem").textContent = `${sim.selecionadas.length} / ${escolas.length} ${t("selecionadas")}`;
    id("simTotais").innerHTML = `
      <div class="indicador"><div class="rotulo">${t("totalRecebido")}</div>
        <div class="valor">${dinheiro(c.receita)}</div></div>
      <div class="indicador"><div class="rotulo">${t("totalImpostos")}</div>
        <div class="valor">${dinheiro(c.imposto)}</div><div class="nota">${numero(sim.imposto,2)}% ${idioma==="pt-BR"?"do recebido":"of revenue"}</div></div>
      <div class="indicador"><div class="rotulo">${t("totalGastos")}</div>
        <div class="valor">${dinheiro(c.gastos)}</div></div>
      <div class="indicador"><div class="rotulo">${t("valorSocio")}</div>
        <div class="valor">${dinheiro(c.socio)}</div>
        <div class="nota">${numero(sim.socio,2)}% ${idioma==="pt-BR"?"sobre":"of"} ${dinheiro(c.baseSocio)}</div></div>
      <div class="indicador"><div class="rotulo">${t("baseSocio")}</div>
        <div class="valor">${dinheiro(c.baseSocio)}</div><div class="nota">${t("baseSocioNota")}</div></div>
      <div class="indicador"><div class="rotulo">${t("custoTotal")}</div>
        <div class="valor">${dinheiro(c.custoTotal)}</div></div>
      <div class="indicador ${c.lucro<0?"perigo":"ok"}"><div class="rotulo">${t("lucro")}</div>
        <div class="valor">${dinheiro(c.lucro)}</div>
        <div class="nota">${t("margemLiquida")}: ${numero(c.margemLiquida,1)}%</div></div>
      <div class="indicador ${c.margem<1?"perigo":"ok"}"><div class="rotulo">${t("margem")}</div>
        <div class="valor">${c.custoTotal>0 ? numero(c.margem,2)+"x" : "—"}</div></div>`;
    c.linhas.forEach(l=>{
      const r = id(`simR${l.e.id}`), g = id(`simG${l.e.id}`), lu = id(`simL${l.e.id}`);
      if (r) r.textContent = dinheiro(l.receita);
      if (g) g.textContent = dinheiro(l.gastos);
      if (lu){ lu.textContent = dinheiro(l.receita-l.gastos);
        lu.style.color = (l.receita-l.gastos) < 0 ? "var(--perigo)" : "var(--texto)"; }
      const tr = id(`simTr${l.e.id}`);
      if (tr) tr.style.opacity = l.dentro ? "1" : ".42";
    });
  }

  const corpo = id("simCorpo");
  corpo.innerHTML = escolas.map(e=>`
    <tr id="simTr${e.id}">
      <td><input type="checkbox" data-sim="${e.id}" ${sim.selecionadas.includes(e.id)?"checked":""}
        aria-label="${esc(e.escola)}" style="width:16px;height:16px"></td>
      <td class="mono">${esc(e.inep)}</td>
      <td><b>${esc(e.escola)}</b><br><small style="color:var(--texto-2)">${esc(e.cidade)}${e.uf?"/"+esc(e.uf):""} · ${esc(e.nomeParceiro||"—")}</small></td>
      <td class="num"><input type="number" min="0" class="num" style="width:82px;text-align:right"
        value="${apsDe(e)}" data-aps="${e.id}"></td>
      <td class="num mono" id="simR${e.id}"></td>
      <td class="num mono" id="simG${e.id}"></td>
      <td class="num mono" id="simL${e.id}"></td>
    </tr>`).join("");

  corpo.querySelectorAll("[data-sim]").forEach(chk=> chk.onchange = ()=>{
    const eid = chk.dataset.sim;
    if (chk.checked){ if(!sim.selecionadas.includes(eid)) sim.selecionadas.push(eid); }
    else sim.selecionadas = sim.selecionadas.filter(x=>x!==eid);
    pintarTotais();
  });
  corpo.querySelectorAll("[data-aps]").forEach(inp=> inp.addEventListener("input", ()=>{
    sim.aps[inp.dataset.aps] = Math.max(0, Math.trunc(Number(inp.value)||0));
    pintarTotais();
  }));
  id("sImposto").addEventListener("input", ()=>{ sim.imposto = Number(id("sImposto").value)||0; pintarTotais(); });
  id("sSocio").addEventListener("input", ()=>{ sim.socio = Number(id("sSocio").value)||0; pintarTotais(); });
  id("btTodas").onclick = ()=>{ sim.selecionadas = todos.slice(); desenhar(); };
  id("btNenhuma").onclick = ()=>{ sim.selecionadas = []; desenhar(); };

  pintarTotais();
}

function modalParceiro(x){
  const novo = !x;
  const custos = (x && Array.isArray(x.custos) ? x.custos : []).map(c=>({
    descricao:c.descricao, tipo:c.tipo, valor:Number(c.valor)||0
  }));
  const TIPOS = [["ap",t("tipoAp")],["kit",t("tipoKit")],["rack",t("tipoRack")],["fixo",t("tipoFixo")]];

  abrirModal(novo ? t("novoParceiro") : t("editar"), `
    <div class="campo"><label for="paNome">${t("nome")} *</label><input id="paNome" value="${esc(x?x.nome:"")}"></div>
    <div class="grade g2">
      <div class="campo"><label for="paDoc">${t("documento")}</label><input id="paDoc" class="num" value="${esc(x?x.documento:"")}"></div>
      <div class="campo"><label for="paContato">${t("contato")}</label><input id="paContato" value="${esc(x?x.contato:"")}"></div>
      <div class="campo"><label for="paEmail">${t("email")}</label><input id="paEmail" type="email" value="${esc(x?x.email:"")}"></div>
      <div class="campo"><label for="paTel">${t("telefone")}</label><input id="paTel" class="num" value="${esc(x?x.telefone:"")}"></div>
    </div>

    <div class="escolha" style="margin-bottom:14px">
      <input type="checkbox" id="paMisc" ${x && x.compraMiscelaneos ? "checked":""}>
      <div class="info"><b><label for="paMisc" style="margin:0;color:var(--texto);font-size:13.5px">${t("compraMiscelaneos")}</label></b>
        <small style="color:var(--texto-2)">${t("compraMiscelaneosNota")}</small></div>
    </div>

    <h3 style="margin-bottom:4px">${t("custosParceiro")}</h3>
    <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 10px">${t("custosNota")}</p>
    <div id="paCustos"></div>
    <button class="btn neutro pequeno" id="btAddCusto" style="margin-bottom:14px">+ ${t("adicionarCusto")}</button>

    <div class="campo"><label for="paObs">${t("observacao")}</label><textarea id="paObs">${esc(x?x.observacao:"")}</textarea></div>
    ${novo?"":`<div class="campo"><label for="paAtivo">${t("status")}</label>
      <select id="paAtivo"><option value="1" ${x.ativo?"selected":""}>${t("ativo")}</option>
      <option value="0" ${!x.ativo?"selected":""}>${t("inativo")}</option></select></div>`}
  `, [{ texto:t("salvar"), classe:"btn", acao: async ()=>{
      try{
        const resposta = await api("parceiros.salvar", {
          id: x?x.id:"", nome: val("paNome"), documento: val("paDoc"), contato: val("paContato"),
          email: val("paEmail"), telefone: val("paTel"), observacao: val("paObs"),
          compraMiscelaneos: id("paMisc").checked, custos,
          ativo: novo ? true : val("paAtivo")==="1",
        });
        fecharModal();
        torrada(`${t("salvo")} ${resposta.custosGravados ?? 0} ${t("custosParceiro").toLowerCase()}.`, "ok");
        desenhar();
      }catch(e){ torrada(e.message,"erro",e.codigo); }
    }}]);

  function montarCustos(){
    const cont = id("paCustos");
    if (custos.length === 0){
      cont.innerHTML = `<p style="color:var(--texto-3);font-size:12.5px;margin:0 0 10px">${t("semCustos")}</p>`;
      return;
    }
    cont.innerHTML = custos.map((c,i)=>`
      <div style="display:grid;grid-template-columns:1fr 140px 130px 34px;gap:7px;margin-bottom:7px;align-items:center">
        <input value="${esc(c.descricao)}" placeholder="${t("descricao")}" data-cd="${i}">
        <select data-ct="${i}">${TIPOS.map(([v,rot])=>`<option value="${v}" ${c.tipo===v?"selected":""}>${rot}</option>`).join("")}</select>
        <input class="num" inputmode="numeric" value="${dinheiro(c.valor)}" data-cv="${i}">
        <button class="btn neutro pequeno" data-cx="${i}">×</button>
      </div>`).join("");

    cont.querySelectorAll("[data-cd]").forEach(inp=> inp.addEventListener("input", ()=>{
      custos[Number(inp.dataset.cd)].descricao = inp.value;
    }));
    cont.querySelectorAll("[data-ct]").forEach(sel=> sel.addEventListener("change", ()=>{
      custos[Number(sel.dataset.ct)].tipo = sel.value;
    }));
    cont.querySelectorAll("[data-cv]").forEach(inp=> inp.addEventListener("input", ()=>{
      custos[Number(inp.dataset.cv)].valor = formatarMoeda(inp);
    }));
    cont.querySelectorAll("[data-cx]").forEach(bt=> bt.onclick = ()=>{
      custos.splice(Number(bt.dataset.cx), 1); montarCustos();
    });
  }

  id("btAddCusto").onclick = ()=>{ custos.push({descricao:"",tipo:"fixo",valor:0}); montarCustos(); };
  montarCustos();
}

async function telaPedidoForm(alvo){
  carregando(alvo);
  if (!estado.rascunho) estado.rascunho = estado.dados.rascunho || rascunhoNovo();
  const rasc = estado.rascunho;

  let escolas = [];
  try{
    const r = await api("escolas.listar", { apenasDisponiveis: true });
    escolas = r.escolas;
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; return; }

  const UNIDADES = ["UN","PC","CX","M","M2","M3","KG","L","RL","CJ","PAR","SC"];
  const editando = !!rasc.id;

  const totalItem = (i)=> Math.round(((Number(i.quantidade)||0)*(Number(i.valorUnitario)||0))*100)/100;
  const totalPedido = ()=> Math.round(rasc.itens.reduce((s,i)=> s+totalItem(i), 0)*100)/100;

  function dividirIgual(){
    if (rasc.rateios.length===0) return;
    const total = totalPedido();
    const parte = Math.floor(total*100/rasc.rateios.length)/100;
    rasc.rateios.forEach((r,i)=>{
      r.valor = (i===rasc.rateios.length-1)
        ? Math.round((total - parte*(rasc.rateios.length-1))*100)/100
        : parte;
    });
  }

  // ---------------------------------------------------------------- esqueleto
  alvo.innerHTML = `
    <div class="cabeca">
      <div><h1>${editando ? `${t("numero")} #${estado.dados.numero||""}` : t("novoPedido")}</h1>
        <p>${t("destino")}</p></div>
      <button class="btn neutro" id="btVoltar">${t("voltar")}</button>
    </div>
    ${editando && estado.dados.observacaoFinanceiro ? `<div class="aviso alerta" style="margin-bottom:16px">
      <h4>${t("decisao")}</h4>${esc(estado.dados.observacaoFinanceiro)}</div>`:""}

    <div class="pedido-grade">
      <div class="cartao cartao-pad">
        <h3 style="margin-bottom:12px">${t("itens")}</h3>
        <div id="listaItens"></div>
        <button class="btn neutro pequeno" id="btAddItem">+ ${t("adicionarItem")}</button>
        <hr style="border:0;border-top:1px solid var(--linha);margin:16px 0">
        <div class="campo"><label for="pFornecedor">${t("fornecedor")}</label>
          <input id="pFornecedor" value="${esc(rasc.fornecedor)}"></div>
        <div class="campo"><label for="pObs">${t("observacao")}</label>
          <textarea id="pObs">${esc(rasc.observacao)}</textarea></div>
        <div class="indicador" style="border-color:var(--sinal)">
          <div class="rotulo">${t("valorTotal")}</div>
          <div class="valor" id="totalPedido">${dinheiro(0)}</div></div>
      </div>

      <div class="cartao cartao-pad">
        <h3 style="margin-bottom:4px">${t("ineps")}</h3>
        <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 12px">${t("divisaoAuto")}</p>
        ${escolas.length===0 ? `<div class="vazio"><h3>${t("semEscolasDisponiveis")}</h3></div>` : `
        <input id="fBuscaEscola" placeholder="${t("buscar")}" style="margin-bottom:10px">
        <div class="lista-rolagem" id="listaEscolas"></div>`}
        <div id="avisoRateio" style="margin-top:12px"></div>
        <div class="barra-acoes" style="margin-top:14px">
          <button class="btn" id="btEnviar">${editando ? t("reenviar") : t("enviarFinanceiro")}</button>
        </div>
      </div>
    </div>`;

  // ---------------------------------------------------------------- itens
  function montarItens(){
    const lista = id("listaItens");
    lista.innerHTML = "";
    rasc.itens.forEach((item, i)=>{
      const bloco = document.createElement("div");
      bloco.className = "item";
      bloco.innerHTML = `
        <div class="item-cabeca">
          <span class="indice">${t("itens")} ${i+1}</span>
          <button class="btn neutro pequeno" data-remover="${i}" title="${t("excluir")}">${t("excluir")}</button>
        </div>
        <label for="it${i}desc">${t("descricao")}</label>
        <textarea class="descricao" id="it${i}desc" data-campo="descricao" data-i="${i}"
          placeholder="${t("descricao")}">${esc(item.descricao)}</textarea>
        <div class="item-numeros">
          <div><label for="it${i}qtd">${t("qtd")}</label>
            <input id="it${i}qtd" type="number" step="0.001" min="0" class="num"
              value="${item.quantidade}" data-campo="quantidade" data-i="${i}"></div>
          <div><label for="it${i}un">${t("unidade")}</label>
            <select id="it${i}un" data-campo="unidade" data-i="${i}">
              ${UNIDADES.map(u=>`<option ${item.unidade===u?"selected":""}>${u}</option>`).join("")}</select></div>
          <div><label for="it${i}vu">${t("valorUnitario")}</label>
            <input id="it${i}vu" class="num" inputmode="numeric"
              value="${dinheiro(item.valorUnitario||0)}" data-campo="valorUnitario" data-i="${i}"></div>
          <div><label>${t("valorTotal")}</label>
            <input class="num" id="it${i}total" value="${dinheiro(totalItem(item))}" disabled></div>
        </div>`;
      lista.appendChild(bloco);
    });

    lista.querySelectorAll("[data-campo]").forEach(campo=>{
      const evento = campo.tagName === "SELECT" ? "change" : "input";
      campo.addEventListener(evento, ()=>{
        const i = Number(campo.dataset.i);
        const c = campo.dataset.campo;
        if (c === "descricao" || c === "unidade"){
          rasc.itens[i][c] = campo.value;
          atualizarAviso();                         // so revalida, nao redesenha
          return;
        }
        rasc.itens[i][c] = (c === "valorUnitario")
          ? formatarMoeda(campo)
          : Number(String(campo.value).replace(",", ".")) || 0;
        const celula = id(`it${i}total`);
        if (celula) celula.value = dinheiro(totalItem(rasc.itens[i]));
        dividirIgual();
        atualizarTotais();
        sincronizarRateios();
        atualizarAviso();
      });
    });

    lista.querySelectorAll("[data-remover]").forEach(b=> b.onclick = ()=>{
      rasc.itens.splice(Number(b.dataset.remover), 1);
      if (rasc.itens.length === 0) rasc.itens.push({descricao:"",quantidade:1,unidade:"UN",valorUnitario:0});
      dividirIgual(); montarItens(); atualizarTotais(); montarEscolas(); atualizarAviso();
    });
  }

  // ---------------------------------------------------------------- escolas
  function montarEscolas(){
    const cont = id("listaEscolas");
    if (!cont) return;
    const campoBusca = id("fBuscaEscola");
    const busca = (campoBusca ? campoBusca.value : "").toLowerCase();
    cont.innerHTML = "";
    escolas
      .filter(e=> !busca || `${e.inep} ${e.escola} ${e.cidade}`.toLowerCase().includes(busca))
      .forEach(e=>{
        const sel = rasc.rateios.find(r=>r.escolaId===e.id);
        const div = document.createElement("div");
        div.className = "escolha";
        div.innerHTML = `
          <input type="checkbox" ${sel?"checked":""} data-sel="${e.id}" aria-label="${esc(e.escola)}">
          <div class="info">
            <b>${esc(e.escola)}</b>
            <small class="mono">${esc(e.inep)} · ${esc(e.cidade)}${e.uf?"/"+esc(e.uf):""}</small>
            ${(e.status !== "Em andamento" || e.miscelaneosPor !== "nos") ? `<div style="margin:5px 0 2px;display:flex;gap:5px;flex-wrap:wrap">
              ${e.status !== "Em andamento" ? seloEscola(e.status) : ""}
              ${e.miscelaneosPor !== "nos" ? `<span class="selo cinza">${t("miscelaneosParceiro")}</span>` : ""}
            </div>` : ""}
            ${barraCapacidade(e)}
          </div>
          ${sel?`<div style="width:120px;flex:none;text-align:right">
            <b class="mono" data-valor="${e.id}">${dinheiro(sel.valor||0)}</b></div>`:""}`;
        cont.appendChild(div);
      });

    cont.querySelectorAll("[data-sel]").forEach(chk=> chk.onchange = ()=>{
      const eid = chk.dataset.sel;
      if (chk.checked) rasc.rateios.push({ escolaId:eid, valor:0 });
      else rasc.rateios = rasc.rateios.filter(r=>r.escolaId!==eid);
      dividirIgual(); montarEscolas(); atualizarAviso();
    });


  }

  // Atualiza so os valores exibidos no rateio, sem remontar a lista.
  function sincronizarRateios(){
    document.querySelectorAll("[data-valor]").forEach(campo=>{
      const r = rasc.rateios.find(x=>x.escolaId===campo.dataset.valor);
      if (r) campo.textContent = dinheiro(r.valor);
    });
  }

  function atualizarTotais(){
    const campo = id("totalPedido");
    if (campo) campo.textContent = dinheiro(totalPedido());
  }

  // Lista o que ainda impede o envio. Vazia = pode enviar.
  function pendencias(){
    const faltas = [];
    rasc.itens.forEach((item, i)=>{
      const rotulo = `${t("itens")} ${i+1}`;
      if (!String(item.descricao||"").trim()) faltas.push(`${rotulo}: ${t("faltaDescricao")}`);
      if ((Number(item.quantidade)||0) <= 0) faltas.push(`${rotulo}: ${t("faltaQtd")}`);
      if ((Number(item.valorUnitario)||0) <= 0) faltas.push(`${rotulo}: ${t("faltaValor")}`);
    });
    if (rasc.rateios.length === 0) faltas.push(t("faltaInep"));
    return faltas;
  }

  function atualizarAviso(){
    const alvoAviso = id("avisoRateio");
    if (!alvoAviso) return;
    const partes = [];
    const faltas = pendencias();

    const botao = id("btEnviar");
    if (botao) botao.disabled = faltas.length > 0;

    if (faltas.length > 0){
      partes.push(`<div class="aviso alerta"><h4>${t("faltando")}</h4>
        <ul>${faltas.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`);
    } else if (rasc.rateios.length > 0){
      partes.push(`<div class="aviso info">${t("parteCada")}
        <b class="mono">${dinheiro(rasc.rateios[0].valor)}</b>
        (${rasc.rateios.length} ${t("ineps")}).</div>`);
    }
    const estouros = rasc.rateios.map(r=>{
      const e = escolas.find(x=>x.id===r.escolaId);
      if (!e) return null;
      const novo = (Number(e.gastoTotal)||0) + (Number(r.valor)||0);
      if (Number(e.limite) > 0 && novo > Number(e.limite)+0.01)
        return `${esc(e.inep)} — ${esc(e.escola)}: <b class="mono">+${dinheiro(novo-e.limite)}</b>`;
      if (Number(e.limite) <= 0) return `${esc(e.inep)} — ${esc(e.escola)}: ${t("semLimite")}`;
      return null;
    }).filter(Boolean);
    if (estouros.length > 0){
      partes.push(`<div class="aviso alerta"><h4>${t("avisoEstouro")}</h4>
        <ul>${estouros.map(x=>`<li>${x}</li>`).join("")}</ul>
        <p style="margin:8px 0 0">${t("excedeAviso")}</p></div>`);
    }
    alvoAviso.innerHTML = partes.join("");
  }

  // ---------------------------------------------------------------- envio
  async function enviar(){
    try{
      const r = await api("pedidos.salvar", {
        id: rasc.id, fornecedor: rasc.fornecedor, observacao: rasc.observacao,
        itens: rasc.itens, rateios: rasc.rateios,
      });
      estado.rascunho = null;
      torrada(t("salvo"), "ok");
      irPara("pedidoDetalhe", { id: r.id });
    }catch(e){ torrada(e.message, "erro", e.codigo); }
  }

  // ---------------------------------------------------------------- ligacoes
  id("btAddItem").onclick = ()=>{
    rasc.itens.push({descricao:"",quantidade:1,unidade:"UN",valorUnitario:0});
    montarItens(); atualizarTotais();
    const ultimo = id(`it${rasc.itens.length-1}desc`);
    if (ultimo) ultimo.focus();
  };
  id("pFornecedor").addEventListener("input", ()=> rasc.fornecedor = id("pFornecedor").value);
  id("pObs").addEventListener("input", ()=> rasc.observacao = id("pObs").value);
  id("btVoltar").onclick = ()=>{ estado.rascunho = null; irPara("pedidos"); };
  id("btEnviar").onclick = ()=>{
    const faltas = pendencias();
    if (faltas.length > 0){ torrada(faltas[0], "erro"); atualizarAviso(); return; }
    enviar();
  };
  if (id("fBuscaEscola")) id("fBuscaEscola").addEventListener("input", montarEscolas);


  montarItens();
  montarEscolas();
  atualizarTotais();
  atualizarAviso();
}

/* ===================================================================
   15. TELA — DETALHE DO PEDIDO (financeiro decide, comprador acompanha)
   =================================================================== */
async function telaPedidoDetalhe(alvo){
  carregando(alvo);
  try{
    const r = await api("pedidos.detalhe", { id: estado.dados.id });
    const p = r.pedido;
    const perfil = estado.usuario.perfil;
    const podeDecidir = (perfil==="financeiro"||perfil==="admin") && p.status!=="PAGO";
    const podeEditar = (perfil==="comprador"||perfil==="admin") && ["EM_ESPERA","RECUSADO"].includes(p.status);
    const ultimaObs = [...r.eventos].reverse().find(ev=> ev.observacao);

    alvo.innerHTML = `
      <div class="cabeca">
        <div><h1>${t("numero")} #${p.numero} ${seloStatus(p.status)}</h1>
          <p>${t("comprador")}: ${esc(p.compradorNome)} · ${dataHora(p.criadoEm)}
             ${p.fornecedor?` · ${t("fornecedor")}: ${esc(p.fornecedor)}`:""}</p></div>
        <div class="barra-acoes">
          ${podeEditar?`<button class="btn" id="btEditar">${t("editar")}</button>`:""}
          <button class="btn neutro" id="btVoltar">${t("voltar")}</button>
        </div>
      </div>

      ${p.excedeuLimite?`<div class="aviso perigo" style="margin-bottom:14px"><b>${t("limiteEstourado")}</b> —
        ${idioma==="pt-BR"?"o comprador confirmou o envio mesmo assim.":"the buyer confirmed it anyway."}</div>`:""}
      ${ultimaObs && p.status!=="PAGO" ? `<div class="aviso alerta" style="margin-bottom:14px">
        <h4>${esc(ultimaObs.usuarioNome)} · ${dataHora(ultimaObs.criadoEm)}</h4>${esc(ultimaObs.observacao)}</div>`:""}

      <div class="grade g2" style="align-items:start">
        <div class="cartao">
          <div class="cartao-pad" style="padding-bottom:0"><h3>${t("itens")}</h3></div>
          <div class="tabela-rolagem"><table>
            <thead><tr><th>${t("descricao")}</th><th class="num">${t("qtd")}</th><th>${t("unidade")}</th>
              <th class="num">${t("valorUnitario")}</th><th class="num">${t("valorTotal")}</th></tr></thead>
            <tbody>${r.itens.map(i=>`<tr>
              <td>${esc(i.descricao)}</td>
              <td class="num mono">${numero(i.quantidade,3)}</td>
              <td class="mono">${esc(i.unidade)}</td>
              <td class="num mono">${dinheiro(i.valorUnitario)}</td>
              <td class="num mono">${dinheiro(i.valorTotal)}</td></tr>`).join("")}
              <tr><td colspan="4" style="text-align:right"><b>${t("valorTotal")}</b></td>
                  <td class="num mono"><b>${dinheiro(p.valorTotal)}</b></td></tr></tbody>
          </table></div>
          ${p.observacao?`<div class="cartao-pad"><label>${t("observacao")}</label>${esc(p.observacao)}</div>`:""}
        </div>

        <div>
          <div class="cartao cartao-pad" style="margin-bottom:14px">
            <h3 style="margin-bottom:12px">${t("ineps")}</h3>
            ${r.rateios.map(x=>`
              <div style="padding:10px 0;border-bottom:1px solid var(--linha-2)">
                <div style="display:flex;justify-content:space-between;gap:10px">
                  <div><b>${esc(x.escola)}</b><br><small class="mono" style="color:var(--texto-2)">${esc(x.inep)}</small></div>
                  <div class="mono"><b>${dinheiro(x.valor)}</b></div>
                </div>
                ${barraCapacidade({limite:x.limite, gastoInstalacao:0, gastoPedidos:x.gastoTotal, percentualUso: x.limite>0 ? x.gastoTotal/x.limite*100 : 0})}
              </div>`).join("")}
          </div>

          ${podeDecidir?`<div class="cartao cartao-pad">
            <h3 style="margin-bottom:12px">${t("decisao")}</h3>
            <div class="campo"><label for="dObs">${t("observacao")}</label><textarea id="dObs" placeholder="${t("obsObrigatoria")}"></textarea></div>
            <div class="barra-acoes">
              <button class="btn ok" data-decisao="pagar">${t("pagar")}</button>
              <button class="btn alerta" data-decisao="espera">${t("espera")}</button>
              <button class="btn perigo" data-decisao="recusar">${t("recusar")}</button>
            </div>
          </div>`:""}

          <div class="cartao cartao-pad" style="margin-top:14px">
            <h3 style="margin-bottom:10px">${t("historico")}</h3>
            ${r.eventos.map(ev=>`<div style="padding:8px 0;border-bottom:1px solid var(--linha-2)">
              <div class="mono" style="font-size:11.5px;color:var(--texto-3)">${dataHora(ev.criadoEm)} · ${esc(ev.usuarioNome)}</div>
              <div><b>${t("st"+ev.acao) !== "st"+ev.acao ? t("st"+ev.acao) : esc(ev.acao)}</b>
                ${ev.observacao?` — ${esc(ev.observacao)}`:""}</div>
            </div>`).join("")}
          </div>
        </div>
      </div>`;

    id("btVoltar").onclick = ()=>irPara("pedidos");
    if (id("btEditar")) id("btEditar").onclick = ()=>{
      estado.rascunho = {
        id: p.id, fornecedor: p.fornecedor, observacao: p.observacao,
        itens: r.itens.map(i=>({descricao:i.descricao, quantidade:Number(i.quantidade), unidade:i.unidade, valorUnitario:Number(i.valorUnitario)})),
        rateios: r.rateios.map(x=>({escolaId:x.escolaId, valor:Number(x.valor)})),
      };
      irPara("pedidoNovo", { numero:p.numero, observacaoFinanceiro: ultimaObs?ultimaObs.observacao:"" });
    };
    alvo.querySelectorAll("[data-decisao]").forEach(b=> b.onclick = async ()=>{
      const decisao = b.dataset.decisao;
      const obs = id("dObs").value.trim();
      if (decisao!=="pagar" && !obs){ torrada(t("obsObrigatoria"),"erro"); id("dObs").focus(); return; }
      try{
        await api("pedidos.decidir", { id:p.id, decisao, observacao:obs });
        torrada(t("salvo"),"ok"); desenhar();
      }catch(e){ torrada(e.message,"erro",e.codigo); }
    });
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; }
}

/* ===================================================================
   16. MODAL
   =================================================================== */
function abrirModal(titulo, corpoHtml, botoes){
  fecharModal();
  const cortina = document.createElement("div");
  cortina.className = "cortina"; cortina.id = "cortina";
  cortina.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-cabeca"><h2>${esc(titulo)}</h2><button class="fechar" id="btFechar" aria-label="fechar">×</button></div>
      <div class="modal-corpo">${corpoHtml}</div>
      <div class="modal-pe" id="modalPe"></div>
    </div>`;
  document.body.appendChild(cortina);
  const pe = id("modalPe");
  (botoes||[]).forEach(b=>{
    const bt = document.createElement("button");
    bt.className = b.classe || "btn"; bt.textContent = b.texto; bt.onclick = b.acao;
    pe.appendChild(bt);
  });
  if (!botoes || botoes.length===0){
    const bt = document.createElement("button");
    bt.className="btn neutro"; bt.textContent=t("voltar"); bt.onclick=fecharModal; pe.appendChild(bt);
  }
  id("btFechar").onclick = fecharModal;
  cortina.addEventListener("click", e=>{ if(e.target===cortina) fecharModal(); });
}
function fecharModal(){ const c = id("cortina"); if (c) c.remove(); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") fecharModal(); });

/* ===================================================================
   17. PARTIDA
   =================================================================== */
(async function iniciar(){
  const salvo = ler("idioma"); if (salvo) idioma = salvo;
  estado.token = ler("token");
  if (estado.token){
    try{
      const r = await api("sessao.me", {});
      estado.usuario = r.usuario;
      estado.tela = r.usuario.precisaTrocarSenha ? "trocarSenha" : "painel";
    }catch(e){ encerrarLocal(); }
  }
  desenhar();
})();
</script>
