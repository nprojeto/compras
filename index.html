<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Gasto por INEP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   CONTROLE DE GASTO POR INEP — folha de estilo unica
   Direcao visual: "planta baixa" — azul-tinta, papel claro, numeros
   monoespacados. O elemento assinatura e a barra de capacidade do INEP.
   =================================================================== */
:root{
  --tinta:#101C2E; --tinta-2:#1B2C44; --tinta-3:#2A3E5A;
  --papel:#F2F4F7; --branco:#FFFFFF; --linha:#DCE3EC; --linha-2:#EDF1F6;
  --texto:#16202E; --texto-2:#5A6B80; --texto-3:#8896A8;
  --sinal:#0B5FCB; --sinal-claro:#E7F0FE;
  --ok:#0E7A61; --ok-claro:#E3F4EF;
  --alerta:#A9670B; --alerta-claro:#FDF3E2;
  --perigo:#B42318; --perigo-claro:#FDECEA;
  --r:10px; --sombra:0 1px 2px rgba(16,28,46,.06), 0 8px 24px rgba(16,28,46,.06);
  --rail:236px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  background:var(--papel); color:var(--texto); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Archivo",sans-serif; margin:0; letter-spacing:-.01em; font-weight:600}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px}
.mono,.num,td.num,th.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
a{color:var(--sinal)}
button{font-family:inherit}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-arte{
  background:var(--tinta); color:#fff; padding:56px 48px; display:flex;
  flex-direction:column; justify-content:space-between;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:28px 28px;
}
.login-arte h1{font-size:38px;line-height:1.1;max-width:9em;color:#fff}
.login-arte p{color:#9FB2CB;max-width:32ch}
.login-selo{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;color:#6E86A5;text-transform:uppercase}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-card{width:100%;max-width:360px}
@media(max-width:860px){ .login-wrap{grid-template-columns:1fr} .login-arte{display:none} }

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--tinta);color:#C7D4E5;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.rail .marca{font-family:"Archivo",sans-serif;font-weight:700;color:#fff;font-size:15px;padding:0 10px 4px;letter-spacing:-.01em}
.rail .marca span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;color:#6E86A5;font-weight:400;margin-top:3px}
.rail hr{border:0;border-top:1px solid rgba(255,255,255,.09);margin:14px 0 10px;width:100%}
.rail button{
  display:block;width:100%;text-align:left;background:transparent;border:0;color:#C7D4E5;
  padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer;
}
.rail button:hover{background:rgba(255,255,255,.07);color:#fff}
.rail button.ativo{background:var(--sinal);color:#fff;font-weight:600}
.rail .rodape{margin-top:auto;font-size:11px;color:#6E86A5;padding:0 10px}
.rail .quem{padding:10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:6px}
.rail .quem b{color:#fff;display:block;font-size:13px}
.rail .quem em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8FA6C2}
.conteudo{padding:26px 30px 60px;max-width:1500px}
.cabeca{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
details.dobra summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
details.dobra summary::-webkit-details-marker{display:none}
details.dobra summary h3{font-size:15px}
details.dobra summary .seta{font-family:"IBM Plex Mono",monospace;color:var(--texto-3);font-size:12px}
details.dobra[open] summary .seta{transform:rotate(90deg)}
details.dobra summary .seta{display:inline-block;transition:transform .15s ease}
.cabeca p{margin:4px 0 0;color:var(--texto-2)}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .rail .marca,.rail hr,.rail .rodape,.rail .quem{display:none}
  .conteudo{padding:18px 16px 50px}
}

/* ---------- componentes ---------- */
.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.cartao-pad{padding:18px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:620px){.g4,.g2{grid-template-columns:1fr}}

.indicador{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);padding:14px 16px}
.indicador .rotulo{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3)}
.indicador .valor{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.indicador .nota{font-size:12px;color:var(--texto-2);margin-top:2px}
.indicador.perigo .valor{color:var(--perigo)}
.indicador.ok .valor{color:var(--ok)}

label{display:block;font-size:12.5px;font-weight:500;color:var(--texto-2);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:8px;background:var(--branco);
  font-family:inherit;font-size:14px;color:var(--texto);
}
input.num,input[type=number]{font-family:"IBM Plex Mono",monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sinal);outline-offset:-1px;border-color:var(--sinal)}
textarea{min-height:80px;resize:vertical}
.campo{margin-bottom:14px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;
  padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--sinal);color:#fff;
}
.btn:hover{filter:brightness(.94)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.neutro{background:var(--branco);color:var(--texto);border-color:var(--linha)}
.btn.ok{background:var(--ok)} .btn.alerta{background:var(--alerta)} .btn.perigo{background:var(--perigo)}
.btn.fantasma{background:transparent;color:var(--sinal)}
.btn.pequeno{padding:6px 11px;font-size:12.5px}
.barra-acoes{display:flex;gap:9px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--texto-3);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--linha);
  white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
tbody tr:hover{background:var(--linha-2)}
td.num,th.num{text-align:right}
.tabela-rolagem{overflow-x:auto;border-radius:var(--r)}

.selo{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;
}
.selo.azul{background:var(--sinal-claro);color:var(--sinal)}
.selo.verde{background:var(--ok-claro);color:var(--ok)}
.selo.ambar{background:var(--alerta-claro);color:var(--alerta)}
.selo.vermelho{background:var(--perigo-claro);color:var(--perigo)}
.selo.cinza{background:var(--linha-2);color:var(--texto-2)}
.selo.roxo{background:#EFE9FB;color:#5B3FA8}
input.invalido,select.invalido{border-color:var(--perigo);background:#FFFBFA}
.erro-campo{display:block;color:var(--perigo);font-size:11.5px;margin-top:3px;min-height:1px}
.etapas{display:flex;gap:6px;flex-wrap:wrap}
.etapa{flex:1;min-width:120px;text-align:center;position:relative}
.etapa .bolha{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;
  display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;
  font-size:12.5px;font-weight:600;background:var(--linha);color:var(--texto-3)}
.etapa .rotulo{font-size:11.5px;color:var(--texto-3);line-height:1.3}
.etapa.feita .bolha{background:var(--ok);color:#fff}
.etapa.feita .rotulo{color:var(--texto-2)}
.etapa.agora .bolha{background:var(--sinal);color:#fff;box-shadow:0 0 0 4px var(--sinal-claro)}
.etapa.agora .rotulo{color:var(--sinal);font-weight:600}
.anexo{border:1px solid var(--linha);border-radius:10px;padding:13px;margin-bottom:10px}
.anexo.vazio-arq{border-style:dashed;background:var(--linha-2)}
.anexo .titulo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.anexo .titulo h4{font-family:"Archivo",sans-serif;font-size:13.5px}
.anexo .arquivo{font-family:"IBM Plex Mono",monospace;font-size:12.5px;word-break:break-all}

/* ---------- ASSINATURA: barra de capacidade do INEP ---------- */
.capacidade{margin-top:6px}
.capacidade .trilho{
  height:9px;border-radius:999px;background:var(--linha);overflow:hidden;display:flex;
  box-shadow:inset 0 0 0 1px rgba(16,28,46,.05);
}
.capacidade .parte{height:100%}
.capacidade .instalacao{background:var(--tinta-3)}
.capacidade .compras{background:var(--sinal)}
.capacidade .estouro{
  background:repeating-linear-gradient(45deg,var(--perigo),var(--perigo) 4px,#e0574c 4px,#e0574c 8px);
}
.capacidade .legenda{
  display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--texto-2);margin-top:5px;gap:10px;
}
.capacidade .legenda b{color:var(--texto)}

.aviso{border-radius:var(--r);padding:13px 15px;font-size:13.5px;border:1px solid}
.aviso.info{background:var(--sinal-claro);border-color:#C6DDFB;color:#0A4894}
.aviso.alerta{background:var(--alerta-claro);border-color:#F2DFBC;color:#7A4A08}
.aviso.perigo{background:var(--perigo-claro);border-color:#F6CFCB;color:#8C1B12}
.aviso.ok{background:var(--ok-claro);border-color:#BFE5DA;color:#0A5C49}
.aviso h4{margin-bottom:5px}
.aviso ul{margin:6px 0 0 18px;padding:0}

.vazio{text-align:center;padding:44px 20px;color:var(--texto-2)}
.vazio h3{margin-bottom:6px;color:var(--texto)}

/* ---------- modal ---------- */
.cortina{position:fixed;inset:0;background:rgba(16,28,46,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal{background:var(--branco);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(16,28,46,.3)}
.modal-cabeca{padding:18px 20px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--branco)}
.modal-corpo{padding:20px}
.modal-pe{padding:14px 20px;border-top:1px solid var(--linha);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--branco)}
.fechar{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--texto-3)}

/* ---------- aviso flutuante ---------- */
#torradeira{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.torrada{background:var(--tinta);color:#fff;padding:11px 15px;border-radius:9px;font-size:13.5px;max-width:420px;box-shadow:0 10px 30px rgba(16,28,46,.3);user-select:text}
.torrada.ok{background:var(--ok)}
.torrada.erro{background:var(--perigo);cursor:pointer;padding-right:34px;position:relative}
.torrada.erro::after{content:"×";position:absolute;right:12px;top:9px;font-size:17px;opacity:.8}
.torrada.erro small{display:block;opacity:.85;font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:5px}

.pedido-grade{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1080px){.pedido-grade{grid-template-columns:1fr}}
.item{border:1px solid var(--linha);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--branco)}
.item-cabeca{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.item-cabeca .indice{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3)}
.item textarea.descricao{min-height:56px;line-height:1.45}
.item-numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}
.item-numeros label{font-size:11px;margin-bottom:3px}
@media(max-width:600px){.item-numeros{grid-template-columns:repeat(2,minmax(0,1fr))}}
.escolha{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--linha);border-radius:8px;margin-bottom:7px;background:var(--branco)}
.escolha input[type=checkbox]{width:16px;height:16px;margin:0;flex:none}
.escolha .info{flex:1;min-width:0}
.escolha .info b{display:block;font-size:13.5px}
.escolha .info small{color:var(--texto-2)}
.escolha.bloqueada{opacity:.55;background:var(--linha-2)}
.lista-rolagem{max-height:330px;overflow:auto;padding-right:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
*:focus-visible{outline:2px solid var(--sinal);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){ .capacidade .parte{transition:width .25s ease} }
</style>
</head>

function guardar(chave, valor){ try{ localStorage.setItem(chave, valor); }catch(e){ memoria[chave]=valor; } }
function ler(chave){ try{ return localStorage.getItem(chave) || memoria[chave] || ""; }catch(e){ return memoria[chave] || ""; } }
function apagar(chave){ try{ localStorage.removeItem(chave); }catch(e){} delete memoria[chave]; }

function dinheiro(v){
  return (Number(v)||0).toLocaleString(idioma==="en"?"en-US":"pt-BR",{style:"currency",currency:"BRL"});
}
function numero(v,casas){ return (Number(v)||0).toLocaleString(idioma==="en"?"en-US":"pt-BR",{minimumFractionDigits:casas||0,maximumFractionDigits:casas||0}); }
function dataHora(v){ if(!v) return "-"; return new Date(v).toLocaleString(idioma==="en"?"en-US":"pt-BR"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* Mascara de moeda: o campo e texto, o usuario digita so numeros e a
   ultima dupla de digitos vira centavos. deMoeda() devolve o numero puro. */
function deMoeda(texto){
  const digitos = String(texto ?? "").replace(/\D/g, "");
  return digitos ? Number(digitos)/100 : 0;
}
function formatarMoeda(campo){
  const digitos = String(campo.value).replace(/\D/g, "");
  const valor = digitos ? Number(digitos)/100 : 0;
  campo.value = digitos ? dinheiro(valor) : "";
  return valor;
}
function moedaVal(x){ const e = id(x); return e ? deMoeda(e.value) : 0; }

/* Aviso de erro NAO some sozinho: fica ate o clique, para dar tempo de ler
   e copiar a mensagem. Aviso de sucesso continua sumindo em 5 segundos. */
/* Le o arquivo escolhido e devolve so a parte base64, que e o que o
   backend espera dentro do corpo da requisicao. */
function lerArquivo(arquivo){
  return new Promise((resolver, recusar)=>{
    const leitor = new FileReader();
    leitor.onload = ()=> resolver(String(leitor.result).split(",")[1] || "");
    leitor.onerror = ()=> recusar(new Error("Nao consegui ler o arquivo."));
    leitor.readAsDataURL(arquivo);
  });
}
function tamanhoLegivel(bytes){
  const n = Number(bytes)||0;
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(0) + " KB";
  return (n/1024/1024).toFixed(1) + " MB";
}

/* Gera um CSV que o Excel abre com as colunas ja separadas:
   BOM no inicio (acentos), ponto e virgula como separador e virgula
   decimal, que e o padrao do Excel em portugues. */
function baixarCsv(nomeArquivo, cabecalho, linhas){
  const celula = (v)=>{
    if (v === null || v === undefined) return "";
    if (typeof v === "number") return String(v.toFixed(2)).replace(".", ",");
    const texto = String(v);
    return /[;"\n]/.test(texto) ? '"' + texto.replace(/"/g, '""') + '"' : texto;
  };
  const conteudo = "\ufeff" +
    [cabecalho, ...linhas].map(linha => linha.map(celula).join(";")).join("\r\n");

  const blob = new Blob([conteudo], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function carimboData(){
  const d = new Date();
  const dois = (n)=> String(n).padStart(2, "0");
  return `${d.getFullYear()}-${dois(d.getMonth()+1)}-${dois(d.getDate())}-${dois(d.getHours())}${dois(d.getMinutes())}`;
}

function torrada(texto, tipo, codigo){
  const d=document.createElement("div");
  d.className="torrada "+(tipo||"");
  d.textContent=texto;
  if (tipo==="erro" && codigo){
    const s=document.createElement("small");

    d.appendChild(s);
  }
  id("torradeira").appendChild(d);
  if (tipo==="erro"){
    console.error("[gasto-inep]", texto, codigo||"");
    d.onclick=()=>d.remove();
  } else {
    setTimeout(()=>d.remove(), 5200);
  }
}

   4. UNICA FUNCAO QUE CONVERSA COM O BACKEND
   =================================================================== */
async function api(acao, dados){
  const cabecalhos = { "Content-Type":"application/json" };
  if (SUPABASE_ANON_KEY){
    cabecalhos["apikey"] = SUPABASE_ANON_KEY;
    cabecalhos["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
  }
  let resposta;
  try{
    resposta = await fetch(API_URL, {
      method:"POST", headers:cabecalhos,
      body: JSON.stringify({ acao, token: estado.token, dados: dados||{} })
    });
  }catch(e){
    throw new Error("Nao consegui falar com o servidor. Confira a URL da API e a conexao.");
  }
  let corpo = {};
  try{ corpo = await resposta.json(); }catch(e){ throw new Error("Resposta invalida do servidor."); }
  if (!corpo.ok){
    if (resposta.status === 401){ encerrarLocal(); desenhar(); }
    const falha = new Error(corpo.erro || "Erro inesperado.");
    falha.codigo = corpo.codigo || "";
    throw falha;
  }
  return corpo.dados;
}

function barraCapacidade(e){
  const limite = Number(e.limite)||0;
  const inst = Number(e.gastoInstalacao)||0;
  const compras = Number(e.gastoPedidos)||0;
  const total = inst + compras;
  const base = Math.max(limite, total, 1);
  const pInst = Math.min(100, inst/base*100);
  const pCompras = Math.min(100-pInst, compras/base*100);
  const estouro = Math.max(0, total-limite);
  const pEstouro = limite>0 ? Math.min(100, estouro/base*100) : 0;
  const classe = limite<=0 ? "" : (total>limite ? "perigo" : (total/limite>0.85 ? "alerta" : "ok"));
  return `
   <div class="capacidade">
     <div class="trilho">
       <div class="parte instalacao" style="width:${pInst}%"></div>
       <div class="parte compras" style="width:${pCompras - pEstouro > 0 ? pCompras - pEstouro : 0}%"></div>
       ${pEstouro>0 ? `<div class="parte estouro" style="width:${pEstouro}%"></div>` : ""}
     </div>
     <div class="legenda">
       <span><b>${dinheiro(total)}</b> / ${limite>0 ? dinheiro(limite) : t("semLimite")}</span>
       <span class="${classe==="perigo"?"":""}" style="color:${classe==="perigo"?"var(--perigo)":classe==="alerta"?"var(--alerta)":"var(--texto-2)"}">
         ${limite>0 ? numero(e.percentualUso,1)+"%" : "—"}
       </span>
     </div>
   </div>`;
}

/* A tabela de kits vem do banco (o admin edita na tela de Kits).
   Se ainda nao foi carregada, cai no calculo classico: 1.740 + 610 por AP. */
const VALOR_KIT_1 = 1740, VALOR_AP_ADICIONAL = 610;

async function carregarKits(recarregar){
  if (!estado.kits || recarregar){
    try{ estado.kits = await api("kits.listar", {}); }
    catch(e){ estado.kits = { kits:[], apAdicional:VALOR_AP_ADICIONAL }; }
  }
  return estado.kits;
}

function receitaPorAps(aps){
  const n = Math.trunc(Number(aps) || 0);
  if (n <= 0) return 0;
  const tabela = estado.kits;
  const adicional = tabela ? Number(tabela.apAdicional)||0 : VALOR_AP_ADICIONAL;
  const linhas = tabela ? [...tabela.kits].sort((x,y)=>x.aps-y.aps) : [];
  if (linhas.length === 0) return Math.round((VALOR_KIT_1 + adicional*(n-1))*100)/100;

  const exato = linhas.find(k=>Number(k.aps)===n);
  if (exato) return Math.round(Math.max(0, Number(exato.valor))*100)/100;

  const menores = linhas.filter(k=>Number(k.aps)<n);
  if (menores.length === 0){
    const primeiro = linhas[0];
    return Math.round(Math.max(0, Number(primeiro.valor) - adicional*(Number(primeiro.aps)-n))*100)/100;
  }
  const base = menores[menores.length-1];
  return Math.round(Math.max(0, Number(base.valor) + adicional*(n-Number(base.aps)))*100)/100;
}

async function telaPainel(alvo){
  carregando(alvo);
  const admin = estado.usuario.perfil === "admin";
  if (admin) await carregarKits();

  let escolas = [], pedidos = {};
  try{
    const [lista, resumo] = await Promise.all([
      api("escolas.listar", {}),
      api("painel.resumo", {}),
    ]);
    escolas = lista.escolas.filter(e=>e.ativo);
    pedidos = resumo.pedidos;
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; return; }

  const kits = estado.kits || {};
  const percentualGasto = Number(kits.percentualGasto)||0;
  const percentualImposto = Number(kits.percentualImposto)||0;
  const percentualSocio = Number(kits.percentualSocio)||0;

  if (!estado.painel) estado.painel = {
    busca:"", status:"", parceiro:"", nfDe:"", nfAte:"", selecionadas:null, kitsAberto:false,
  };
  const f = estado.painel;

  const todos = escolas.map(e=>e.id);
  f.selecionadas = f.selecionadas === null ? todos.slice() : f.selecionadas.filter(x=>todos.includes(x));

  const parceirosDaLista = [...new Set(escolas.map(e=>e.nomeParceiro).filter(Boolean))].sort();

  // O filtro define o recorte; a caixa de selecao refina dentro dele.
  function visiveis(){
    const busca = (f.busca||"").toLowerCase();
    return escolas.filter(e=>{
      if (f.status && e.status !== f.status) return false;
      if (f.parceiro === "__sem__" && e.nomeParceiro) return false;
      if (f.parceiro && f.parceiro !== "__sem__" && e.nomeParceiro !== f.parceiro) return false;
      if (busca && !`${e.inep} ${e.escola} ${e.cidade} ${e.uf}`.toLowerCase().includes(busca)) return false;
      // Periodo da NF: escola sem data fica de fora quando ha recorte.
      if (f.nfDe && (!e.dataNf || e.dataNf < f.nfDe)) return false;
      if (f.nfAte && (!e.dataNf || e.dataNf > f.nfAte)) return false;
      return true;
    });
  }

  /* Base do calculo: APs instalados; se ainda nao ha nenhum, os previstos.
     Vale para receita, limite e custo do parceiro (o backend ja resolve isso
     em apsBase / receita / limite / gastoTotal). */
  function linhas(){
    return visiveis().map(e=>({
      e,
      aps: Number(e.apsBase)||0,
      receita: Number(e.receita)||0,
      gastos: Number(e.gastoTotal)||0,
      limite: Number(e.limite)||0,
      previsto: !!e.usandoPrevisto,
      dentro: f.selecionadas.includes(e.id),
    }));
  }

  /* Cadeia de resultado: imposto sobre o recebido;
     socio sobre (recebido - gastos - imposto); o resto e a margem Novale. */
  function fechar(lista){
    const receita = lista.reduce((s,l)=> s + l.receita, 0);
    const gastos = lista.reduce((s,l)=> s + l.gastos, 0);
    const imposto = receita * percentualImposto / 100;
    const baseSocio = receita - gastos - imposto;
    const socio = Math.max(0, baseSocio) * percentualSocio / 100;
    const custoTotal = gastos + imposto + socio;
    const lucro = receita - custoTotal;
    const limite = lista.reduce((s,l)=> s + l.limite, 0);
    return {
      receita, gastos, imposto, baseSocio, socio, custoTotal, lucro, limite,
      saldo: limite - gastos,
      estouradas: lista.filter(l=> l.limite > 0 && l.gastos > l.limite).length,
      aps: lista.reduce((s,l)=> s + l.aps, 0),
      margem: custoTotal > 0 ? receita/custoTotal : 0,
      margemLiquida: receita > 0 ? lucro/receita*100 : 0,
    };
  }

  // -------------------------------------------------------------- esqueleto
  alvo.innerHTML = `
    <div class="cabeca">
      <div><h1>${t("painel")}</h1><p>${t("baseCalculoNota")}</p></div>
    </div>

    <div class="cartao cartao-pad" style="margin-bottom:16px">
      <div class="grade g4">
        <div class="campo" style="margin:0;grid-column:span 2"><label for="fPnBusca">${t("buscar")}</label>

        <div class="campo" style="margin:0"><label for="fPnStatus">${t("status")}</label>
          <select id="fPnStatus">
            <option value="">${t("todosStatus")}</option>
            ${STATUS_ESCOLA.map(x=>`<option value="${x}" ${f.status===x?"selected":""}>${x}</option>`).join("")}
          </select></div>
        <div class="campo" style="margin:0"><label for="fPnParceiro">${t("parceiro")}</label>
          <select id="fPnParceiro">
            <option value="">${t("todosParceiros")}</option>
            <option value="__sem__" ${f.parceiro==="__sem__"?"selected":""}>${t("semParceiroFiltro")}</option>
            ${parceirosDaLista.map(x=>`<option value="${esc(x)}" ${f.parceiro===x?"selected":""}>${esc(x)}</option>`).join("")}
          </select></div>
      </div>

      ${admin?`
      <div class="grade g4" style="margin-top:14px">
        <div class="campo" style="margin:0"><label for="fPnNfDe">${t("periodoNf")} — ${t("de")}</label>
          <input id="fPnNfDe" type="date" value="${esc(f.nfDe)}"></div>
        <div class="campo" style="margin:0"><label for="fPnNfAte">${t("periodoNf")} — ${t("ate")}</label>
          <input id="fPnNfAte" type="date" value="${esc(f.nfAte)}"></div>
        <div class="campo" style="margin:0"></div>
        <div class="campo" style="margin:0"></div>
      </div>

      <hr style="border:0;border-top:1px solid var(--linha);margin:14px 0">
      <div class="grade g4">
        <div class="campo" style="margin:0"><label>${t("imposto")}</label>
          <input class="num" value="${numero(percentualImposto,2)}" disabled></div>
        <div class="campo" style="margin:0"><label>${t("socio")}</label>
          <input class="num" value="${numero(percentualSocio,2)}" disabled></div>
        <div class="campo" style="margin:0"><label>&nbsp;</label>
          <div class="barra-acoes">
            <button class="btn neutro pequeno" id="btTodas">${t("marcarVisiveis")}</button>
            <button class="btn neutro pequeno" id="btNenhuma">${t("desmarcarVisiveis")}</button>
          </div></div>
        <div class="campo" style="margin:0"><label>&nbsp;</label>
          <div class="mono" id="pnMarcadas" style="padding-top:9px;color:var(--texto-2);font-size:12.5px"></div></div>
      </div>`:""}

      <div class="barra-acoes" style="margin-top:10px">
        <button class="btn neutro pequeno" id="btPnLimpar">${t("limparFiltros")}</button>
        <button class="btn pequeno" id="btPnExportar">${t("baixarPlanilha")}</button>
        <span class="mono" id="pnContagem" style="align-self:center;color:var(--texto-2);font-size:12.5px"></span>
      </div>
    </div>

    ${admin?`
    <details class="cartao dobra" style="margin-bottom:16px" id="pnKits" ${f.kitsAberto?"open":""}>
      <summary class="cartao-pad">
        <span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="seta">▶</span>
          <h3>${t("tabelaKits")}</h3>
          <span class="selo cinza">${numero((kits.kits||[]).length)} ${t("kits").toLowerCase()}</span>
          <span class="selo azul">${numero(percentualGasto,2)}% ${t("percentualGasto").toLowerCase()}</span>
        </span>
        <span class="btn neutro pequeno" id="btIrKits" role="button" tabindex="0">${t("editarKits")}</span>
      </summary>
      <div class="cartao-pad" style="padding-top:0">
        <div class="grade g2" style="align-items:start">
          <div class="tabela-rolagem">
            <table>
              <thead><tr><th>${t("kit")}</th><th class="num">${t("aps")}</th><th class="num">${t("valor")}</th></tr></thead>
              <tbody>
                ${[...(kits.kits||[])].sort((a,b)=>a.aps-b.aps).map((k,i)=>`<tr>
                  <td class="mono">KIT ${i+1}</td>
                  <td class="num mono">${numero(k.aps)}</td>
                  <td class="num mono">${dinheiro(k.valor)}</td></tr>`).join("")}
                <tr><td class="mono">${t("apAdicional")}</td>
                  <td class="num mono">+1</td>
                  <td class="num mono">${dinheiro(kits.apAdicional||0)}</td></tr>
              </tbody>
            </table>
          </div>
          <div class="grade" style="gap:10px">
            <div class="indicador"><div class="rotulo">${t("percentualImposto")}</div>
              <div class="valor">${numero(percentualImposto,2)}%</div></div>
            <div class="indicador"><div class="rotulo">${t("percentualSocio")}</div>
              <div class="valor">${numero(percentualSocio,2)}%</div></div>
            <div class="indicador"><div class="rotulo">${t("margemLucro")}</div>
              <div class="valor">${numero(kits.margemLucro||0,2)}%</div></div>
            <div class="indicador" style="border-color:var(--sinal)"><div class="rotulo">${t("percentualGasto")}</div>
              <div class="valor">${numero(percentualGasto,2)}%</div>
              <div class="nota">${t("percentualGastoNota")}</div></div>
          </div>
        </div>
      </div>
    </details>`:""}

    ${admin?`<div class="grade g4" id="pnLucro" style="margin-bottom:16px"></div>`:""}
    <div class="grade g4" id="pnVerba" style="margin-bottom:16px"></div>
    <div class="grade g4" id="pnPedidos" style="margin-bottom:16px"></div>

    <div class="cartao tabela-rolagem">
      <table>
        <thead><tr>
          ${admin?`<th style="width:34px"></th>`:""}
          <th>${t("inep")}</th><th>${t("escola")}</th><th>${t("status")}</th>
          <th class="num">${t("aps")}</th>
          ${admin?`<th class="num">${t("receita")}</th>`:""}
          <th class="num">${t("totalGastos")}</th>
          <th class="num">${t("limite")}</th><th class="num">${t("saldo")}</th>
          ${admin?`<th class="num">${t("lucro")}</th>`:""}
          <th></th>
        </tr></thead>
        <tbody id="pnCorpo"></tbody>
      </table>
    </div>`;

  // -------------------------------------------------------------- pintura
  function pintar(){
    const todasLinhas = linhas();
    const naConta = todasLinhas.filter(l=>l.dentro);
    const c = fechar(naConta);

    id("pnContagem").textContent = `${todasLinhas.length} / ${escolas.length} ${t("escolasNoRecorte")}`;
    if (id("pnMarcadas")) id("pnMarcadas").textContent = `${naConta.length} ${t("selecionadas")}`;

    if (id("pnLucro")) id("pnLucro").innerHTML = `
      <div class="indicador"><div class="rotulo">${t("totalRecebido")}</div>
        <div class="valor">${dinheiro(c.receita)}</div></div>
      <div class="indicador"><div class="rotulo">${t("totalImpostos")}</div>
        <div class="valor">${dinheiro(c.imposto)}</div>
        <div class="nota">${numero(percentualImposto,2)}% ${idioma==="pt-BR"?"do recebido":"of revenue"}</div></div>
      <div class="indicador"><div class="rotulo">${t("totalGastos")}</div>
        <div class="valor">${dinheiro(c.gastos)}</div></div>
      <div class="indicador"><div class="rotulo">${t("baseSocio")}</div>
        <div class="valor">${dinheiro(c.baseSocio)}</div>
        <div class="nota">${t("baseSocioNota")}</div></div>
      <div class="indicador"><div class="rotulo">${t("valorSocio")}</div>
        <div class="valor">${dinheiro(c.socio)}</div>
        <div class="nota">${numero(percentualSocio,2)}% ${idioma==="pt-BR"?"sobre a base":"of the base"}</div></div>
      <div class="indicador"><div class="rotulo">${t("custoTotal")}</div>
        <div class="valor">${dinheiro(c.custoTotal)}</div></div>
      <div class="indicador ${c.lucro<0?"perigo":"ok"}"><div class="rotulo">${t("lucro")}</div>
        <div class="valor">${dinheiro(c.lucro)}</div>
        <div class="nota">${t("margemLiquida")}: ${numero(c.margemLiquida,1)}%</div></div>
      <div class="indicador ${c.margem<1?"perigo":"ok"}"><div class="rotulo">${t("margem")}</div>
        <div class="valor">${c.custoTotal>0 ? numero(c.margem,2)+"x" : "—"}</div></div>`;

    id("pnVerba").innerHTML = `
      <div class="indicador"><div class="rotulo">${t("escolasAtivas")}</div>
        <div class="valor">${numero(naConta.length)}</div>
        <div class="nota">${numero(escolas.length)} ${idioma==="pt-BR"?"no total":"in total"}</div></div>
      <div class="indicador"><div class="rotulo">${t("apsBase")}</div>
        <div class="valor">${numero(c.aps)}</div>
        <div class="nota">${numero(naConta.reduce((a,l)=>a+(Number(l.e.qtdApsInst)||0),0))} ${t("apsInstalados").toLowerCase()} ·
          ${numero(naConta.reduce((a,l)=>a+(Number(l.e.qtdApsPrev)||0),0))} ${t("apsPrev").toLowerCase()}</div></div>
      <div class="indicador"><div class="rotulo">${t("limite")}</div>
        <div class="valor">${dinheiro(c.limite)}</div>
        <div class="nota">${numero(percentualGasto,2)}% ${t("padraoKits")}</div></div>
      <div class="indicador ${c.saldo<0?"perigo":"ok"}"><div class="rotulo">${t("saldo")}</div>
        <div class="valor">${dinheiro(c.saldo)}</div>
        <div class="nota">${numero(c.estouradas)} ${t("estouradas").toLowerCase()}</div></div>`;

    id("pnPedidos").innerHTML = `
      <div class="indicador"><div class="rotulo">${t("aguardando")}</div><div class="valor">${numero(pedidos.ENVIADO||0)}</div></div>
      <div class="indicador"><div class="rotulo">${t("emEspera")}</div><div class="valor">${numero(pedidos.EM_ESPERA||0)}</div></div>
      <div class="indicador"><div class="rotulo">${t("recusados")}</div><div class="valor">${numero(pedidos.RECUSADO||0)}</div></div>
      <div class="indicador"><div class="rotulo">${t("pagos")}</div><div class="valor">${numero(pedidos.PAGO||0)}</div></div>`;

    const corpo = id("pnCorpo");
    if (todasLinhas.length === 0){
      corpo.innerHTML = `<tr><td colspan="10" class="vazio">${t("nenhumFiltro")}</td></tr>`;
      return;
    }
    corpo.innerHTML = todasLinhas.map(l=>{
      const e = l.e;
      const lucro = l.receita - l.gastos;
      return `<tr style="opacity:${l.dentro?"1":".42"}">
        ${admin?`<td><input type="checkbox" data-sim="${e.id}" ${l.dentro?"checked":""}
          aria-label="${esc(e.escola)}" style="width:16px;height:16px"></td>`:""}
        <td class="mono">${esc(e.inep)}</td>
        <td><b>${esc(e.escola)}</b><br><small style="color:var(--texto-2)">${esc(e.cidade)}${e.uf?"/"+esc(e.uf):""} · ${esc(e.nomeParceiro||"—")}</small></td>
        <td>${seloEscola(e.status)}
          ${e.dataNf?`<br><small class="mono" style="color:var(--texto-2)">${esc(e.dataNf.split("-").reverse().join("/"))}</small>`:""}</td>
        <td class="num mono">${numero(e.qtdApsInst)} / ${numero(e.qtdApsPrev)}
          ${l.previsto?`<br><small style="color:var(--alerta);font-family:Inter,sans-serif">${t("usandoPrevisto")}</small>`:""}</td>
        ${admin?`<td class="num mono">${dinheiro(l.receita)}</td>`:""}
        <td class="num mono">${dinheiro(l.gastos)}</td>
        <td class="num mono">${dinheiro(l.limite)}</td>
        <td class="num mono" style="color:${l.limite-l.gastos<0?"var(--perigo)":"var(--ok)"}">${dinheiro(l.limite-l.gastos)}</td>
        ${admin?`<td class="num mono" style="color:${lucro<0?"var(--perigo)":"var(--texto)"}">${dinheiro(lucro)}</td>`:""}
        <td><button class="btn neutro pequeno" data-ver="${e.id}">${t("verEscola")}</button></td>
      </tr>`;
    }).join("");

    corpo.querySelectorAll("[data-ver]").forEach(b=> b.onclick = ()=>irPara("escolaDetalhe",{id:b.dataset.ver}));
    corpo.querySelectorAll("[data-sim]").forEach(chk=> chk.onchange = ()=>{
      const eid = chk.dataset.sim;
      if (chk.checked){ if(!f.selecionadas.includes(eid)) f.selecionadas.push(eid); }
      else f.selecionadas = f.selecionadas.filter(x=>x!==eid);
      pintar();
    });
  }

  // Exporta o recorte que esta na tela; sem filtro, exporta tudo.
  function exportar(){
    const lista = linhas();
    const cabecalho = [
      t("inep"), t("escola"), t("cidade"), t("uf"), t("projeto"),
      t("status"), t("dataNf"), t("parceiro"), t("miscelaneos"), t("prioridade"),
      t("apsInst"), t("apsPrev"), t("apsBase"), t("colBase"),
      ...(admin ? [t("receita")] : []),
      t("totalGastos"), t("limite"), t("saldo"),
      ...(admin ? [t("lucro")] : []),
      t("colNoCalculo"),
    ];

    const corpo = lista.map(l=>{
      const e = l.e;
      return [
        e.inep, e.escola, e.cidade, e.uf, e.projeto,
        e.status, e.dataNf || "", e.nomeParceiro || "",
        e.miscelaneosPor === "nos" ? t("miscelaneosNos") : t("miscelaneosParceiro"),
        e.prioridade,
        Number(e.qtdApsInst)||0, Number(e.qtdApsPrev)||0, l.aps,
        l.previsto ? t("basePrevisto") : t("baseInstalado"),
        ...(admin ? [l.receita] : []),
        l.gastos, l.limite, l.limite - l.gastos,
        ...(admin ? [l.receita - l.gastos] : []),
        l.dentro ? t("colSim") : t("colNao"),
      ];
    });

    // Linha de total: soma so o que entra no calculo, igual aos indicadores.
    const naConta = lista.filter(l=>l.dentro);
    const c = fechar(naConta);
    corpo.push([]);
    corpo.push([
      t("colTotal"), `${naConta.length} ${t("escolasNoRecorte")}`, "", "", "",
      "", "", "", "", "",
      naConta.reduce((a,l)=>a+(Number(l.e.qtdApsInst)||0),0),
      naConta.reduce((a,l)=>a+(Number(l.e.qtdApsPrev)||0),0),
      c.aps, "",
      ...(admin ? [c.receita] : []),
      c.gastos, c.limite, c.saldo,
      ...(admin ? [c.lucro] : []),
      "",
    ]);

    if (admin){
      corpo.push([]);
      corpo.push([t("resumoFinanceiro")]);
      corpo.push([t("totalRecebido"), c.receita]);
      corpo.push([`${t("totalImpostos")} (${numero(percentualImposto,2)}%)`, c.imposto]);
      corpo.push([t("totalGastos"), c.gastos]);
      corpo.push([t("baseSocio"), c.baseSocio]);
      corpo.push([`${t("valorSocio")} (${numero(percentualSocio,2)}%)`, c.socio]);
      corpo.push([t("custoTotal"), c.custoTotal]);
      corpo.push([t("lucro"), c.lucro]);
      corpo.push([t("margemLiquida"), c.margemLiquida]);
      corpo.push([`${t("percentualGasto")}`, percentualGasto]);
    }

    baixarCsv(`gasto-por-inep-${carimboData()}.csv`, cabecalho, corpo);
    torrada(t("planilhaPronta"), "ok");
  }

  // -------------------------------------------------------------- ligacoes
  id("btPnExportar").onclick = exportar;
  if (id("pnKits")){
    id("pnKits").addEventListener("toggle", ()=>{ f.kitsAberto = id("pnKits").open; });
    id("btIrKits").onclick = (ev)=>{ ev.preventDefault(); ev.stopPropagation(); irPara("kits"); };
  }
  id("fPnBusca").addEventListener("input", ()=>{ f.busca = id("fPnBusca").value; pintar(); });
  id("fPnStatus").addEventListener("change", ()=>{ f.status = id("fPnStatus").value; pintar(); });
  id("fPnParceiro").addEventListener("change", ()=>{ f.parceiro = id("fPnParceiro").value; pintar(); });
  if (id("fPnNfDe")) id("fPnNfDe").addEventListener("change", ()=>{ f.nfDe = id("fPnNfDe").value; pintar(); });
  if (id("fPnNfAte")) id("fPnNfAte").addEventListener("change", ()=>{ f.nfAte = id("fPnNfAte").value; pintar(); });
  id("btPnLimpar").onclick = ()=>{
    f.busca = ""; f.status = ""; f.parceiro = ""; f.nfDe = ""; f.nfAte = "";
    id("fPnBusca").value = ""; id("fPnStatus").value = ""; id("fPnParceiro").value = "";
    if (id("fPnNfDe")) id("fPnNfDe").value = "";
    if (id("fPnNfAte")) id("fPnNfAte").value = "";
    pintar();
  };
  if (id("btTodas")) id("btTodas").onclick = ()=>{
    const dentro = new Set([...f.selecionadas, ...visiveis().map(e=>e.id)]);
    f.selecionadas = [...dentro];
    pintar();
  };
  if (id("btNenhuma")) id("btNenhuma").onclick = ()=>{
    const fora = new Set(visiveis().map(e=>e.id));
    f.selecionadas = f.selecionadas.filter(x=>!fora.has(x));
    pintar();
  };

  pintar();
}

/* ===================================================================
   10. TELA — ESCOLAS
   =================================================================== */

  const perfil = estado.usuario.perfil;
  const admin = perfil === "admin";

          ${podeCadastrar?`<button class="btn" id="btNova">${t("novaEscola")}</button>`:""}
        </div>
      </div>
      ${r.escolas.length===0 ? `<div class="cartao vazio"><h3>${t("semEscolas")}</h3></div>` : `
      <div class="cartao tabela-rolagem">
        <table>
          <thead><tr>

/* ===================================================================
   11c. TELA — TABELA DE KITS (admin)
   Estes valores sao a receita do contrato: mexer aqui muda tudo.
   =================================================================== */
async function telaKits(alvo){
  carregando(alvo);
  const tabela = await carregarKits(true);
  const linhas = [...tabela.kits].sort((a,b)=>a.aps-b.aps)
    .map(k=>({ aps:Number(k.aps), valor:Number(k.valor) }));
  let adicional = Number(tabela.apAdicional)||0;
  const pct = {
    imposto: Number(tabela.percentualImposto)||0,
    socio: Number(tabela.percentualSocio)||0,
    margem: Number(tabela.margemLucro)||0,
  };
  /* G = R * (1 - i - m/(1-s)) — mesma conta do backend. */
  const sobra = ()=>{
    const i = pct.imposto/100;
    const so = Math.min(0.999, Math.max(0, pct.socio/100));
    const m = pct.margem/100;
    return Math.round(Math.max(0, Math.min(100, (1 - i - m/(1-so))*100))*100)/100;
  };

  alvo.innerHTML = `
    <div class="cabeca">
      <div><h1>${t("tabelaKits")}</h1><p>${t("kitsAviso")}</p></div>
      <div class="barra-acoes">
        <button class="btn" id="btSalvarKits">${t("salvar")}</button>
      </div>
    </div>

    <div class="grade g2" style="align-items:start">
      <div class="cartao">
        <div class="tabela-rolagem"><table>
          <thead><tr><th>${t("kit")}</th><th class="num">${t("aps")}</th>
            <th class="num">${t("valor")}</th><th style="width:44px"></th></tr></thead>
          <tbody id="kitsCorpo"></tbody>
        </table></div>
        <div class="cartao-pad" style="border-top:1px solid var(--linha)">
          <button class="btn neutro pequeno" id="btAddKit">+ ${t("adicionarKit")}</button>
        </div>
      </div>

      <div>
        <div class="cartao cartao-pad" style="margin-bottom:14px">
          <div class="campo"><label for="kAdicional">${t("apAdicional")}</label>
            <input id="kAdicional" class="num" inputmode="numeric" value="${dinheiro(adicional)}">
            <small style="color:var(--texto-3)">${t("apAdicionalNota")}</small></div>
        </div>

        <div class="cartao cartao-pad">
          <h3 style="margin-bottom:12px">${t("percentuaisGlobais")}</h3>
          <div class="campo"><label for="kImposto">${t("percentualImposto")}</label>
            <input id="kImposto" type="number" step="0.01" min="0" max="100" class="num" value="${pct.imposto}"></div>
          <div class="campo"><label for="kSocio">${t("percentualSocio")}</label>
            <input id="kSocio" type="number" step="0.01" min="0" max="100" class="num" value="${pct.socio}"></div>
          <div class="campo"><label for="kMargem">${t("margemLucro")}</label>
            <input id="kMargem" type="number" step="0.01" min="0" max="100" class="num" value="${pct.margem}"></div>
          <div class="indicador" style="border-color:var(--sinal)">
            <div class="rotulo">${t("percentualGasto")}</div>
            <div class="valor" id="kSobra">${numero(sobra(),2)}%</div>
            <div class="nota">${t("percentualGastoNota")}</div></div>
          <div id="kAvisoSoma" style="margin-top:10px"></div>
          <div style="margin-top:14px">
            <h4 style="font-family:Archivo,sans-serif;font-size:13px;margin-bottom:8px">${t("comoCalcula")}</h4>
            <table style="font-size:12.5px"><tbody id="kDemonstracao"></tbody></table>
          </div>
        </div>
      </div>
    </div>`;

  function montar(){
    const corpo = id("kitsCorpo");
    corpo.innerHTML = linhas.map((k,i)=>`
      <tr>
        <td class="mono">KIT ${i+1}</td>
        <td class="num"><input type="number" min="1" class="num" style="width:78px;text-align:right"
          value="${k.aps}" data-aps="${i}"></td>
        <td class="num"><input class="num" inputmode="numeric" style="width:130px;text-align:right"
          value="${dinheiro(k.valor)}" data-valor="${i}"></td>
        <td><button class="btn neutro pequeno" data-remover="${i}">×</button></td>
      </tr>`).join("");

    corpo.querySelectorAll("[data-aps]").forEach(inp=> inp.addEventListener("input", ()=>{
      linhas[Number(inp.dataset.aps)].aps = Math.max(1, Math.trunc(Number(inp.value)||1));
    }));
    corpo.querySelectorAll("[data-valor]").forEach(inp=> inp.addEventListener("input", ()=>{
      linhas[Number(inp.dataset.valor)].valor = formatarMoeda(inp);
    }));
    corpo.querySelectorAll("[data-remover]").forEach(bt=> bt.onclick = ()=>{
      linhas.splice(Number(bt.dataset.remover), 1); montar();
    });
  }

  id("btAddKit").onclick = ()=>{
    const proximo = linhas.length ? Math.max(...linhas.map(k=>k.aps))+1 : 1;
    linhas.push({ aps:proximo, valor:0 });
    montar();
  };
  id("kAdicional").addEventListener("input", ()=>{ adicional = formatarMoeda(id("kAdicional")); });

  function atualizarSobra(){
    pct.imposto = Number(id("kImposto").value)||0;
    pct.socio = Number(id("kSocio").value)||0;
    pct.margem = Number(id("kMargem").value)||0;
    const teto = sobra();
    id("kSobra").textContent = numero(teto,2)+"%";
    id("kAvisoSoma").innerHTML = teto <= 0
      ? `<div class="aviso perigo">${t("percentualSoma")}</div>` : "";

    // Demonstracao sobre uma receita de R$ 100,00, para ficar legivel.
    const R = 100;
    const imposto = R*pct.imposto/100;
    const gasto = R*teto/100;
    const bruto = R - imposto - gasto;
    const socio = bruto*pct.socio/100;
    id("kDemonstracao").innerHTML = [
      [t("passoReceita"), R, ""],
      [t("passoImposto"), -imposto, numero(pct.imposto,2)+"%"],
      [t("passoGasto"), -gasto, numero(teto,2)+"%"],
      [t("passoLucroBruto"), bruto, "", true],
      [t("passoSocio"), -socio, numero(pct.socio,2)+"%"],
      [t("passoMargem"), bruto-socio, numero(pct.margem,2)+"%", true],
    ].map(([rot,v,pc,forte])=>`<tr>
        <td style="padding:4px 0">${forte?`<b>${rot}</b>`:rot}</td>
        <td class="num mono" style="padding:4px 8px;color:var(--texto-3)">${pc||""}</td>
        <td class="num mono" style="padding:4px 0">${forte?`<b>${dinheiro(v)}</b>`:dinheiro(v)}</td>
      </tr>`).join("");
  }
  ["kImposto","kSocio","kMargem"].forEach(c=> id(c).addEventListener("input", atualizarSobra));
  atualizarSobra();

  id("btSalvarKits").onclick = async ()=>{
    try{
      await api("kits.salvar", {
        kits: linhas, apAdicional: adicional,
        percentualImposto: pct.imposto, percentualSocio: pct.socio, margemLucro: pct.margem,
      });
      await carregarKits(true);
      torrada(t("salvo"), "ok");
      desenhar();
    }catch(e){ torrada(e.message, "erro", e.codigo); }
  };

  montar();
}

/* Mascaras de digitacao. Cada uma devolve o texto ja formatado. */
function mascara(campo, tipo){
  const aplicar = ()=>{
    const n = campo.value.replace(/\D/g, "");
    if (tipo === "cnpj")
      campo.value = n.slice(0,14).replace(/^(\d{2})(\d)/, "$1.$2")
        .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1/$2")
        .replace(/(\d{4})(\d)/, "$1-$2");
    else if (tipo === "cpf")
      campo.value = n.slice(0,11).replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");
    else if (tipo === "cep")
      campo.value = n.slice(0,8).replace(/^(\d{5})(\d)/, "$1-$2");
    else if (tipo === "telefoneFixo"){
      // 00 0000-0000
      const d = n.slice(0,10);
      campo.value = d.length <= 2 ? d
        : d.length <= 6 ? `${d.slice(0,2)} ${d.slice(2)}`
        : `${d.slice(0,2)} ${d.slice(2,6)}-${d.slice(6)}`;
    }
    else if (tipo === "celular"){
      // 00 00000-0000
      const d = n.slice(0,11);
      campo.value = d.length <= 2 ? d
        : d.length <= 7 ? `${d.slice(0,2)} ${d.slice(2)}`
        : `${d.slice(0,2)} ${d.slice(2,7)}-${d.slice(7)}`;
    }
    else if (tipo === "email")
      campo.value = campo.value.replace(/\s/g, "").toLowerCase();
    else if (tipo === "uf")
      campo.value = campo.value.replace(/[^A-Za-z]/g, "").toUpperCase().slice(0,2);
    else if (tipo === "numeros")
      campo.value = n.slice(0,20);
  };
  campo.addEventListener("input", aplicar);
  aplicar();
}

/* Confere na hora: devolve "" quando esta certo. */
function conferirCampo(campo, valor){
  const n = String(valor||"").replace(/\D/g, "");
  if (!valor) return "";
  if (campo === "cnpj") return validarCnpjLocal(valor) ? "" : t("cnpjInvalido");
  if (campo === "representanteCpf") return validarCpfLocal(valor) ? "" : t("cpfInvalido");
  if (campo === "cep") return n.length === 8 ? "" : t("cepInvalido");
  if (campo === "estado") return valor.length === 2 ? "" : t("ufInvalida");
  if (campo === "telefone") return n.length >= 10 ? "" : t("telefoneInvalido");
  if (campo === "celular" || campo === "representanteTelefone")
    return n.length >= 10 ? "" : t("telefoneInvalido");
  if (campo === "email" || campo === "representanteEmail")
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(valor) ? "" : t("emailInvalido");
  return "";
}

function validarCnpjLocal(v){
  const n = String(v||"").replace(/\D/g, "");
  if (n.length !== 14 || /^(\d)\1{13}$/.test(n)) return false;
  const digito = (base)=>{
    let peso = base.length - 7, soma = 0;
    for (let i=0;i<base.length;i++){ soma += Number(base[i])*peso--; if (peso<2) peso = 9; }
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  return digito(n.slice(0,12)) === Number(n[12]) && digito(n.slice(0,13)) === Number(n[13]);
}

function validarCpfLocal(v){
  const n = String(v||"").replace(/\D/g, "");
  if (n.length !== 11 || /^(\d)\1{10}$/.test(n)) return false;
  const digito = (qtd)=>{
    let soma = 0;
    for (let i=0;i<qtd;i++) soma += Number(n[i])*(qtd+1-i);
    const resto = (soma*10) % 11;
    return resto === 10 ? 0 : resto;
  };
  return digito(9) === Number(n[9]) && digito(10) === Number(n[10]);
}

          <h3 style="margin-bottom:12px">${t("dadosEmpresa")}</h3>
          <div class="grade g4">
            ${CAMPOS_FORMULARIO.map(([campo, rotulo, , span])=>`
              <div class="campo" style="margin:0;grid-column:span ${span}">
                <label for="cr_${campo}">${t(rotulo)} *</label>
                <input id="cr_${campo}" autocomplete="off">
                <small class="erro-campo" id="erro_${campo}"></small></div>`).join("")}
          </div>
        </div>

        <div class="cartao cartao-pad" style="margin-bottom:14px">
          <h3 style="margin-bottom:4px">${t("cartaoCnpj")} *</h3>
          <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 10px">${t("cartaoCnpjNota")}</p>
          <input type="file" id="cr_arquivo" accept="application/pdf,.pdf">
        </div>

        <div class="cartao cartao-pad" style="margin-bottom:14px">
          <h3 style="margin-bottom:4px">${t("acessoPlataforma")}</h3>
          <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 12px">${t("acessoNota")}</p>
          <div class="grade g3">
            <div class="campo" style="margin:0"><label>${t("usuario")}</label>
              <input id="cr_login" disabled placeholder="${t("emailViraLogin")}"></div>
            <div class="campo" style="margin:0"><label for="cr_senha">${t("senha")} *</label>
              <input id="cr_senha" type="password" autocomplete="new-password">
              <small style="color:var(--texto-3)">${t("senhaRegra")}</small></div>
            <div class="campo" style="margin:0"><label for="cr_senha2">${t("repetirSenha")} *</label>
              <input id="cr_senha2" type="password" autocomplete="new-password">
              <small class="erro-campo" id="erro_senha"></small></div>
          </div>
        </div>

        <div id="cr_aviso"></div>
        <div class="barra-acoes">
          <button class="btn" id="btEnviarCred">${t("enviarSolicitacao")}</button>
          <button class="btn neutro" id="btCancelarCred">${t("cancelar")}</button>
        </div>
      </main>
    </div>`;

  // Cada campo se confere ao sair, mostrando o problema logo abaixo.
  CAMPOS_FORMULARIO.forEach(([campo, , tipoMascara])=>{
    const entrada = id("cr_"+campo);
    if (tipoMascara) mascara(entrada, tipoMascara);
    const conferir = ()=>{
      const problema = conferirCampo(campo, entrada.value);
      id("erro_"+campo).textContent = problema;
      entrada.classList.toggle("invalido", !!problema);
      return !problema;
    };
    entrada.addEventListener("blur", conferir);
    entrada.addEventListener("input", ()=>{
      if (entrada.classList.contains("invalido")) conferir();
    });
  });
  id("cr_email").addEventListener("input", ()=>{ id("cr_login").value = id("cr_email").value.toLowerCase(); });

  const voltar = ()=>{ estado.tela = "login"; desenhar(); };
  id("btVoltarLogin").onclick = voltar;
  id("btCancelarCred").onclick = voltar;

  id("btEnviarCred").onclick = async ()=>{
    const faltando = [];
    CAMPOS_FORMULARIO.forEach(([campo, rotulo])=>{
      const valor = val("cr_"+campo);
      if (!valor){ faltando.push(t(rotulo)); return; }
      const problema = conferirCampo(campo, valor);
      if (problema){
        faltando.push(`${t(rotulo)}: ${problema}`);
        id("erro_"+campo).textContent = problema;
        id("cr_"+campo).classList.add("invalido");
      }
    });
    const arquivo = id("cr_arquivo").files[0];
    if (!arquivo) faltando.push(t("cartaoCnpj"));
    if (faltando.length > 0){
      id("cr_aviso").innerHTML = `<div class="aviso alerta" style="margin-bottom:12px">
        <h4>${t("faltando")}</h4><ul>${faltando.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
      const primeiro = CAMPOS_FORMULARIO.find(([c])=> !val("cr_"+c) || conferirCampo(c, val("cr_"+c)));
      if (primeiro) id("cr_"+primeiro[0]).focus();
      return;
    }
    id("cr_aviso").innerHTML = "";
    if (arquivo.type !== "application/pdf" && !arquivo.name.toLowerCase().endsWith(".pdf")){
      torrada(t("somentePdf"), "erro"); return;
    }
    if (arquivo.size > 5*1024*1024){ torrada(t("arquivoGrande"), "erro"); return; }
    if (id("cr_senha").value.length < 8 || !/[A-Za-z]/.test(id("cr_senha").value) || !/[0-9]/.test(id("cr_senha").value)){
      id("erro_senha").textContent = t("senhaRegra"); torrada(t("senhaRegra"), "erro"); return;
    }
    if (id("cr_senha").value !== id("cr_senha2").value){
      id("erro_senha").textContent = t("senhasDiferentes"); torrada(t("senhasDiferentes"), "erro"); return;
    }
    id("erro_senha").textContent = "";

    const botao = id("btEnviarCred");
    botao.disabled = true; botao.textContent = t("enviandoArquivo");
    try{
      const dados = {};
      CAMPOS_FORMULARIO.forEach(([campo])=>{ dados[campo] = val("cr_"+campo); });
      dados.senha = id("cr_senha").value;
      dados.cartaoCnpj = { nome: arquivo.name, conteudo: await lerArquivo(arquivo) };
      await api("credenciamento.solicitar", dados);
      alvo.innerHTML = `
        <div class="login-wrap"><section class="login-form"><div class="login-card">
          <div class="aviso ok"><h4>${t("solicitacaoEnviada")}</h4>${t("solicitacaoEnviadaNota")}</div>
          <button class="btn" id="btIrLogin" style="width:100%;justify-content:center;margin-top:14px">${t("entrar")}</button>
        </div></section></div>`;
      id("btIrLogin").onclick = voltar;
    }catch(e){
      torrada(e.message, "erro", e.codigo);
      botao.disabled = false; botao.textContent = t("enviarSolicitacao");
    }
  };
}

/* -------------------------------------------------------------------
   Linha do tempo, compartilhada pelas duas telas
   ------------------------------------------------------------------- */
function linhaDoTempo(status){
  if (status === "RECUSADO"){
    return `<div class="aviso perigo"><b>${t("crRECUSADO")}</b></div>`;
  }
  const atual = ETAPAS_CREDENCIAMENTO.indexOf(status);
  return `<div class="etapas">${ETAPAS_CREDENCIAMENTO.map((etapa, i)=>`
    <div class="etapa ${i < atual ? "feita" : i === atual ? "agora" : ""}">
      <div class="bolha">${i < atual ? "✓" : i+1}</div>
      <div class="rotulo">${t("cr"+etapa)}</div>
    </div>`).join("")}</div>`;
}

      </div>

      <div class="grade g2" style="align-items:start">

          <h3 style="margin-bottom:12px">${t("dadosEmpresa")}</h3>
          <table><tbody>
            ${[["razaoSocial",p.razaoSocial],["cnpj",p.cnpj],
               ["inscricaoEstadual",p.inscricaoEstadual],["inscricaoMunicipal",p.inscricaoMunicipal],
               ["rua",`${p.rua}, ${p.numero} — ${p.bairro}`],
               ["cidade",`${p.cidade}/${p.estado} — ${p.cep}`],
               ["telefoneEmpresa",p.telefone],["celular",p.celular],
               ["pessoaContato",p.pessoaContato],["email",p.email],
               ["representanteNome",p.representanteNome],["representanteCpf",p.representanteCpf],
               ["representanteEmail",p.representanteEmail],["representanteTelefone",p.representanteTelefone],
              ].map(([chave,valor])=>`<tr>
                <th style="width:44%">${t(chave)}</th><td>${esc(valor||"—")}</td></tr>`).join("")}
          </tbody></table>
          <div class="barra-acoes" style="margin-top:12px">
            ${cartao?`<button class="btn neutro pequeno" data-baixar="${cartao.id}">${t("cartaoCnpj")} (PDF)</button>`
                    :`<span class="selo ambar">${t("semCartaoCnpj")}</span>`}

        </div>

        <div>
          <div class="cartao cartao-pad" style="margin-bottom:14px">
            <h3 style="margin-bottom:4px">${t("condicoesContrato")}</h3>
            <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 12px">

            <div class="campo"><label for="crRegiao">${t("regiaoAtuacao")} *</label>

            <div class="grade g2">
              <div class="campo"><label for="crPrazo">${t("prazoPagamento")}</label>

              <div class="campo"><label for="crVigencia">${t("vigenciaMeses")}</label>

            <h3 style="margin-bottom:4px">${r.travado?t("valoresVigentes"):t("valoresNegociados")}</h3>
            <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 10px">
              ${r.custosEmEdicao?t("valoresSoValemDepois"):t("valoresNota")}</p>
            <div id="crCustos"></div>
            <button class="btn neutro pequeno" id="btAddValor" style="margin-bottom:14px">+ ${t("adicionarCusto")}</button>

              <textarea id="crObs">${esc(p.observacaoContrato||"")}</textarea></div>

            <div class="barra-acoes">
              ${!r.travado?`<button class="btn" id="btGerar">${p.contratoGeradoEm?t("regerarContrato"):t("gerarContrato")}</button>`:""}
              ${r.temContrato?`<button class="btn neutro" id="btVerContrato">${t("verContrato")}</button>`:""}

              <div class="arquivo">${esc(assinado.nomeArquivo)}</div>
              <small style="color:var(--texto-2)">${tamanhoLegivel(assinado.tamanho)} ·
                ${t("enviadoPor")} ${esc(assinado.usuarioNome)} · ${dataHora(assinado.criadoEm)}</small>
              <div class="barra-acoes" style="margin-top:10px">
                <button class="btn" data-baixar="${assinado.id}">${t("baixar")} (PDF)</button>
              </div>
            </div>`:""}
            ${p.status === "AGUARDANDO_CONFERENCIA"
              ? `<div class="aviso info" style="margin-bottom:12px">${t("confiraAntes")}</div>`
              : p.status === "ATIVO"
                ? `<div class="aviso ok" style="margin-bottom:12px">${t("jaAtivo")}</div>`
                : `<div class="aviso alerta" style="margin-bottom:12px">${t("aguardaAssinado")}</div>`}

              <textarea id="crMotivo" placeholder="${t("motivoNota")}"></textarea></div>
            <div class="barra-acoes">
              ${p.status === "AGUARDANDO_CONFERENCIA"
                ? `<button class="btn ok" data-decisao="ativar">${t("ativarParceiro")}</button>` : ""}
              ${p.status !== "ATIVO"
                ? `<button class="btn perigo" data-decisao="recusar">${t("recusar")}</button>` : ""}
            </div>
          </div>
        </div>
      </div>`;

    function montarCustos(){
      const cont = id("crCustos");
      cont.innerHTML = custos.map((c,i)=>`
        <div style="border:1px solid var(--linha);border-radius:9px;padding:9px;margin-bottom:8px">
          <div style="display:grid;grid-template-columns:1fr 130px 34px;gap:7px;align-items:center">
            <select data-ct="${i}">${TIPOS.map(([v,rot])=>`<option value="${v}" ${c.tipo===v?"selected":""}>${rot}</option>`).join("")}</select>
            <input class="num" inputmode="numeric" value="${dinheiro(c.valor)}" data-cv="${i}">
            <button class="btn neutro pequeno" data-cx="${i}">×</button>
          </div>
          ${c.tipo==="outro"?`<input style="margin-top:7px" value="${esc(c.descricao)}"
            placeholder="${t("descricaoObrigatoria")}" data-cd="${i}">`:""}
        </div>`).join("");
      cont.querySelectorAll("[data-ct]").forEach(sel=> sel.onchange = ()=>{
        custos[Number(sel.dataset.ct)].tipo = sel.value;
        if (sel.value !== "outro") custos[Number(sel.dataset.ct)].descricao = "";
        montarCustos();
      });
      cont.querySelectorAll("[data-cv]").forEach(inp=> inp.addEventListener("input", ()=>{
        custos[Number(inp.dataset.cv)].valor = formatarMoeda(inp);
      }));
      cont.querySelectorAll("[data-cd]").forEach(inp=> inp.addEventListener("input", ()=>{
        custos[Number(inp.dataset.cd)].descricao = inp.value;
      }));
      cont.querySelectorAll("[data-cx]").forEach(bt=> bt.onclick = ()=>{
        custos.splice(Number(bt.dataset.cx),1);
        if (custos.length===0) custos.push({descricao:"",tipo:"ap",valor:0});
        montarCustos();
      });
    }
    montarCustos();

    // Ativo: nada de editar. Tudo vira leitura ate abrir uma nova revisao.
    if (r.travado){
      alvo.querySelectorAll("#crRegiao, #crPrazo, #crVigencia, #crMisc, #crObs, #crCustos input, #crCustos select")

      alvo.querySelectorAll("#crCustos [data-cx], #btAddValor").forEach(bt=> bt.remove());
    }

    if (id("btAddValor")) id("btAddValor").onclick = ()=>{ custos.push({descricao:"",tipo:"ap",valor:0}); montarCustos(); };
    if (id("btReabrir")) id("btReabrir").onclick = ()=>modalReabrir(p.id);
    if (id("btVerVigente")) id("btVerVigente").onclick = ()=>abrirContrato(p.id, true);
    id("btVoltar").onclick = ()=>irPara("credenciamentos");

    if (id("btGerar")) id("btGerar").onclick = async ()=>{
      try{
        await api("credenciamento.analisar", {
          id: p.id, regiaoAtuacao: val("crRegiao"),
          prazoPagamento: numVal("crPrazo"), vigenciaMeses: numVal("crVigencia"),
          compraMiscelaneos: id("crMisc").checked,
          observacaoContrato: val("crObs"), custos,
        });
        torrada(t("contratoGerado"), "ok");
        desenhar();
      }catch(e){ torrada(e.message, "erro", e.codigo); }
    };

    if (id("btVerContrato")) id("btVerContrato").onclick = ()=>abrirContrato(p.id);

    alvo.querySelectorAll("[data-baixar]").forEach(bt=> bt.onclick = async ()=>{
      try{
        const link = await api("credenciamento.linkAnexo", { id: bt.dataset.baixar });
        window.open(link.url, "_blank");
      }catch(e){ torrada(e.message, "erro", e.codigo); }
    });

    alvo.querySelectorAll("[data-decisao]").forEach(bt=> bt.onclick = async ()=>{
      const decisao = bt.dataset.decisao;
      const motivo = val("crMotivo");
      if (decisao === "recusar" && !motivo){ torrada(t("motivoObrigatorio"), "erro"); id("crMotivo").focus(); return; }
      try{
        await api("credenciamento.decidir", { id: p.id, decisao, motivo });
        torrada(t("salvo"), "ok");
        irPara("credenciamentos");
      }catch(e){ torrada(e.message, "erro", e.codigo); }
    });
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; }
}

/* Abre uma nova revisao do credenciamento. Serve para os dois perfis. */
function modalReabrir(parceiroId){
  abrirModal(t("novoCredenciamento"), `
    <div class="aviso info" style="margin-bottom:12px">${t("travadoNota")}</div>
    <div class="campo"><label for="reMotivo">${t("motivoReabertura")}</label>
      <textarea id="reMotivo" placeholder="${t("motivoReaberturaNota")}"></textarea></div>
  `, [
    { texto:t("cancelar"), classe:"btn neutro", acao: fecharModal },
    { texto:t("confirmarReabertura"), classe:"btn", acao: async ()=>{
        const motivo = val("reMotivo");
        if (!motivo){ torrada(t("motivoReabertura"), "erro"); return; }
        try{
          await api("credenciamento.reabrir", { id: parceiroId || "", motivo });
          fecharModal(); torrada(t("salvo"), "ok"); desenhar();
        }catch(e){ torrada(e.message, "erro", e.codigo); }
      }},
  ]);
}

/* Abre o contrato numa aba nova, pronto para imprimir em PDF. */
async function abrirContrato(id, vigente){
  try{
    const r = await api("credenciamento.contrato", { id: id || "", vigente: vigente === true });
    const aba = window.open("", "_blank");
    if (!aba){ torrada(t("permitaPopup"), "erro"); return; }
    aba.document.open();
    aba.document.write(r.html);
    aba.document.close();
  }catch(e){ torrada(e.message, "erro", e.codigo); }
}

/* -------------------------------------------------------------------
   Painel do parceiro: escolas atribuidas e o que ele tem a receber,
   calculado pelos valores do contrato dele.

/* -------------------------------------------------------------------
   Tela do parceiro: acompanha o processo e entrega o contrato assinado
   ------------------------------------------------------------------- */
async function telaMeuCredenciamento(alvo){
  carregando(alvo);
  try{
    const r = await api("credenciamento.detalhe", {});
    const p = r.parceiro;
    const assinado = r.anexos.find(x=>x.tipo==="contratoAssinado");
    const cartao = r.anexos.find(x=>x.tipo==="cartaoCnpj");

    const passo = {
      AGUARDANDO_ANALISE: t("passoAguardando"),
      EM_ANALISE: t("passoEmAnalise"),
      CONTRATO_GERADO: t("passoAssinar"),
      AGUARDANDO_CONFERENCIA: t("passoConferencia"),
      ATIVO: t("passoAtivo"),
      RECUSADO: t("passoRecusado"),
    }[p.status] || "";

    alvo.innerHTML = `
      <div class="cabeca">
        <div><h1>${t("meuCredenciamento")}</h1>
          <p>${esc(p.razaoSocial)}${Number(p.revisao)>1?` · ${t("revisao")} ${numero(p.revisao)}`:""}</p></div>
        ${r.travado?`<button class="btn neutro" id="btPedirNovo">${t("solicitarNovo")}</button>`:""}
      </div>

      <div class="cartao cartao-pad" style="margin-bottom:16px">
        ${linhaDoTempo(p.status)}
        <div class="aviso ${p.status==="ATIVO"?"ok":p.status==="RECUSADO"?"perigo":"info"}" style="margin-top:16px">
          ${esc(passo)}</div>
        ${p.motivoRecusa?`<div class="aviso alerta" style="margin-top:12px">
          <h4>${t("motivoRecusa")}</h4>${esc(p.motivoRecusa)}</div>`:""}
        ${(!r.travado && p.reabertoEm)?`<div class="aviso info" style="margin-top:12px">
          <h4>${t("reabertoEm")} ${dataHora(p.reabertoEm)}</h4>${esc(p.reaberturaMotivo)}</div>`:""}
      </div>

      ${(r.travado && r.temContratoVigente)?`
      <div class="cartao cartao-pad" style="margin-bottom:16px">
        <h3 style="margin-bottom:4px">${t("contratoVigente")}</h3>
        <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 12px">${t("travadoNota")}</p>
        <div class="barra-acoes">
          <button class="btn" id="btVerVigenteParceiro">${t("verContrato")}</button>
        </div>
      </div>`:""}

      ${(r.temContrato && !r.travado)?`
      <div class="cartao cartao-pad" style="margin-bottom:16px">
        <h3 style="margin-bottom:4px">${t("contrato")} ${Number(p.revisao)>1?`· ${t("emRevisao")}`:""}</h3>
        <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 12px">${t("contratoNota")}</p>
        <div class="barra-acoes">
          <button class="btn" id="btBaixarContrato">${t("verContrato")}</button>
        </div>

        <hr style="border:0;border-top:1px solid var(--linha);margin:16px 0">
        <h3 style="margin-bottom:4px">${t("contratoAssinado")}</h3>
        <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 10px">${t("enviarAssinadoNota")}</p>
        ${assinado?`
        <div class="anexo" style="border-color:var(--ok)">
          <div class="titulo"><h4>${esc(assinado.nomeArquivo)}</h4><span class="selo verde">✓</span></div>
          <small style="color:var(--texto-2)">${tamanhoLegivel(assinado.tamanho)} ·
            ${t("enviadoEm")} ${dataHora(assinado.criadoEm)}</small>
          <div class="barra-acoes" style="margin-top:10px">
            <button class="btn neutro pequeno" data-baixar="${assinado.id}">${t("baixar")}</button>
          </div>
        </div>`:""}

        ${p.status!=="ATIVO"?`
        <div class="anexo vazio-arq">
          <div class="barra-acoes" style="margin-bottom:8px">
            <button class="btn neutro pequeno" id="btEscolherArquivo">
              ${assinado?t("trocarArquivo"):t("escolherArquivo")}</button>
          </div>
          <div id="crNomeArquivo" style="font-size:12.5px;color:var(--texto-2)">${t("aguardandoEnvio")}</div>
          <div class="barra-acoes" style="margin-top:10px">
            <button class="btn" id="btSalvarAssinado" disabled>${t("salvarEnvio")}</button>
          </div>
          <input type="file" id="crArquivoAssinado" accept="application/pdf,.pdf" style="display:none">
        </div>`:""}
      </div>`:""}

      <div class="cartao cartao-pad">
        <h3 style="margin-bottom:12px">${t("dadosEmpresa")}</h3>
        <table><tbody>
          ${[["razaoSocial",p.razaoSocial],["cnpj",p.cnpj],
             ["rua",`${p.rua}, ${p.numero} — ${p.bairro}`],
             ["cidade",`${p.cidade}/${p.estado} — ${p.cep}`],
             ["pessoaContato",p.pessoaContato],["email",p.email],
             ["representanteNome",p.representanteNome],
            ].map(([chave,valor])=>`<tr><th style="width:40%">${t(chave)}</th>
              <td>${esc(valor||"—")}</td></tr>`).join("")}
        </tbody></table>
        ${cartao?`<div class="barra-acoes" style="margin-top:12px">
          <button class="btn neutro pequeno" data-baixar="${cartao.id}">${t("cartaoCnpj")} (PDF)</button></div>`:""}
      </div>`;

    if (id("btBaixarContrato")) id("btBaixarContrato").onclick = ()=>abrirContrato("");
    if (id("btVerVigenteParceiro")) id("btVerVigenteParceiro").onclick = ()=>abrirContrato("", true);
    if (id("btPedirNovo")) id("btPedirNovo").onclick = ()=>modalReabrir("");

    // Escolher o arquivo apenas mostra o nome; o envio so acontece no Salvar.
    if (id("btEscolherArquivo")){
      const campo = id("crArquivoAssinado");
      const salvar = id("btSalvarAssinado");
      let escolhido = null;

      id("btEscolherArquivo").onclick = ()=> campo.click();

      campo.onchange = ()=>{
        const arquivo = campo.files[0];
        escolhido = null;
        salvar.disabled = true;
        if (!arquivo){ id("crNomeArquivo").textContent = t("aguardandoEnvio"); return; }
        if (arquivo.type !== "application/pdf" && !arquivo.name.toLowerCase().endsWith(".pdf")){
          torrada(t("somentePdf"), "erro"); campo.value = "";
          id("crNomeArquivo").textContent = t("aguardandoEnvio"); return;
        }
        if (arquivo.size > 5*1024*1024){
          torrada(t("arquivoGrande"), "erro"); campo.value = "";
          id("crNomeArquivo").textContent = t("aguardandoEnvio"); return;
        }
        escolhido = arquivo;
        salvar.disabled = false;
        id("crNomeArquivo").innerHTML =
          `<b>${t("arquivoEscolhido")}:</b> <span class="mono">${esc(arquivo.name)}</span>
           · ${tamanhoLegivel(arquivo.size)}`;
      };

      salvar.onclick = async ()=>{
        if (!escolhido) return;
        salvar.disabled = true;
        salvar.textContent = t("enviandoArquivo");
        try{
          await api("credenciamento.anexar", {
            tipo: "contratoAssinado", nome: escolhido.name,
            conteudo: await lerArquivo(escolhido),
          });
          torrada(t("salvo"), "ok");
          desenhar();
        }catch(e){
          torrada(e.message, "erro", e.codigo);
          salvar.disabled = false;
          salvar.textContent = t("salvarEnvio");
        }
      };
    }

    alvo.querySelectorAll("[data-baixar]").forEach(bt=> bt.onclick = async ()=>{
      try{
        const link = await api("credenciamento.linkAnexo", { id: bt.dataset.baixar });
        window.open(link.url, "_blank");
      }catch(e){ torrada(e.message, "erro", e.codigo); }
    });
  }catch(e){ alvo.innerHTML = `<div class="aviso perigo">${esc(e.message)}</div>`; }
}

function modalParceiro(x){
  const novo = !x;
  const custos = (x && Array.isArray(x.custos) ? x.custos : []).map(c=>({
    descricao:c.descricao||"", tipo:(c.tipo==="fixo"?"outro":c.tipo)||"ap", valor:Number(c.valor)||0
  }));
  const TIPOS = tiposCusto();

  abrirModal(novo ? t("novoParceiro") : t("editar"), `
    <div class="campo"><label for="paNome">${t("nome")} *</label><input id="paNome" value="${esc(x?x.nome:"")}"></div>
    <div class="grade g2">
      <div class="campo"><label for="paDoc">${t("documento")}</label><input id="paDoc" class="num" value="${esc(x?x.documento:"")}"></div>
      <div class="campo"><label for="paContato">${t("contato")}</label><input id="paContato" value="${esc(x?x.contato:"")}"></div>
      <div class="campo"><label for="paEmail">${t("email")}</label><input id="paEmail" type="email" value="${esc(x?x.email:"")}"></div>
      <div class="campo"><label for="paTel">${t("telefone")}</label><input id="paTel" class="num" value="${esc(x?x.telefone:"")}"></div>
    </div>

    <div class="escolha" style="margin-bottom:14px">
      <input type="checkbox" id="paMisc" ${x && x.compraMiscelaneos ? "checked":""}>
      <div class="info"><b><label for="paMisc" style="margin:0;color:var(--texto);font-size:13.5px">${t("compraMiscelaneos")}</label></b>
        <small style="color:var(--texto-2)">${t("compraMiscelaneosNota")}</small></div>
    </div>

    <h3 style="margin-bottom:4px">${t("custosParceiro")}</h3>
    <p style="color:var(--texto-2);font-size:12.5px;margin:0 0 10px">${t("custosNota")}</p>
    <div id="paCustos"></div>
    <button class="btn neutro pequeno" id="btAddCusto" style="margin-bottom:14px">+ ${t("adicionarCusto")}</button>

    <div class="campo"><label for="paObs">${t("observacao")}</label><textarea id="paObs">${esc(x?x.observacao:"")}</textarea></div>
    ${novo?"":`<div class="campo"><label for="paAtivo">${t("status")}</label>
      <select id="paAtivo"><option value="1" ${x.ativo?"selected":""}>${t("ativo")}</option>
      <option value="0" ${!x.ativo?"selected":""}>${t("inativo")}</option></select></div>`}
  `, [{ texto:t("salvar"), classe:"btn", acao: async ()=>{
      try{
        const resposta = await api("parceiros.salvar", {
          id: x?x.id:"", nome: val("paNome"), documento: val("paDoc"), contato: val("paContato"),
          email: val("paEmail"), telefone: val("paTel"), observacao: val("paObs"),
          compraMiscelaneos: id("paMisc").checked, custos,
          ativo: novo ? true : val("paAtivo")==="1",
        });
        fecharModal();
        torrada(`${t("salvo")} ${resposta.custosGravados ?? 0} ${t("custosParceiro").toLowerCase()}.`, "ok");
        desenhar();
      }catch(e){ torrada(e.message,"erro",e.codigo); }
    }}]);

  function montarCustos(){
    const cont = id("paCustos");
    if (custos.length === 0){
      cont.innerHTML = `<p style="color:var(--texto-3);font-size:12.5px;margin:0 0 10px">${t("semCustos")}</p>`;
      return;
    }
    cont.innerHTML = custos.map((c,i)=>`
      <div style="border:1px solid var(--linha);border-radius:9px;padding:9px;margin-bottom:8px">
        <div style="display:grid;grid-template-columns:1fr 130px 34px;gap:7px;align-items:center">
          <select data-ct="${i}">${TIPOS.map(([v,rot])=>`<option value="${v}" ${c.tipo===v?"selected":""}>${rot}</option>`).join("")}</select>
          <input class="num" inputmode="numeric" value="${dinheiro(c.valor)}" data-cv="${i}">
          <button class="btn neutro pequeno" data-cx="${i}">×</button>
        </div>
        ${c.tipo==="outro"?`<input style="margin-top:7px" value="${esc(c.descricao)}"
          placeholder="${t("descricaoObrigatoria")}" data-cd="${i}">`:""}
      </div>`).join("");

    cont.querySelectorAll("[data-cd]").forEach(inp=> inp.addEventListener("input", ()=>{
      custos[Number(inp.dataset.cd)].descricao = inp.value;
    }));
    cont.querySelectorAll("[data-ct]").forEach(sel=> sel.addEventListener("change", ()=>{
      const linha = custos[Number(sel.dataset.ct)];
      linha.tipo = sel.value;
      if (linha.tipo !== "outro") linha.descricao = "";
      montarCustos();                       // abre ou fecha o campo de descricao
    }));
    cont.querySelectorAll("[data-cv]").forEach(inp=> inp.addEventListener("input", ()=>{
      custos[Number(inp.dataset.cv)].valor = formatarMoeda(inp);
    }));
    cont.querySelectorAll("[data-cx]").forEach(bt=> bt.onclick = ()=>{
      custos.splice(Number(bt.dataset.cx), 1); montarCustos();
    });
  }

  id("btAddCusto").onclick = ()=>{ custos.push({descricao:"",tipo:"ap",valor:0}); montarCustos(); };
  montarCustos();
}
